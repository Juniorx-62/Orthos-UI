<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seletor de cores</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #141414;
  }

  /* ---------- componente ---------- */
  .sphere-picker {
    --size: 200px;
    --ease: cubic-bezier(.22, .8, .24, 1);
    position: relative;
    width: var(--size); aspect-ratio: 1;
    container-type: size;
    perspective: 600px;
    margin: 40px;               /* espaço para sombras/brilho não serem cortados */
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #1d1d1f, #121213 80%);
    outline: none;
  }
  .sphere-picker * { box-sizing: border-box; }

  /* aro multicolorido */
  .sphere-picker::before,
  .sphere-picker::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, #ff4b6e, #ff9a3d 50deg, #ffd23a 90deg, #3ddc6a 130deg,
      #22d3c5 175deg, #3a74e0 215deg, #8a4fd8 250deg, #d03bb8 290deg, #ff4fa3 330deg, #ff4b6e);
    padding: 1.1cqw;
    -webkit-mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    pointer-events: none;
    transition: opacity .5s var(--ease), filter .5s var(--ease);
  }
  .sphere-picker::before { opacity: .9; }
  .sphere-picker::after  { filter: blur(3px); opacity: .35; }
  .sphere-picker:hover::after,
  .sphere-picker:focus-within::after { opacity: .7; filter: blur(4px); }
  .sphere-picker:hover::before { opacity: 1; }

  .sphere {
    --c: #888;
    --dx: 0; --dy: 0; --s: 1; --lift: 0px;
    position: absolute;
    left: var(--x); top: var(--y);
    width: var(--d); aspect-ratio: 1;
    margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
    padding: 0; border: 0; border-radius: 50%;
    cursor: pointer;
    z-index: var(--z);
    -webkit-tap-highlight-color: transparent;
    /* volume fosco: luz acima/esquerda */
    background:
      radial-gradient(circle at 40% 32%,
        color-mix(in oklab, var(--c) 94%, white) 0%,
        var(--c) 55%,
        color-mix(in oklab, var(--c) 90%, black) 100%);
    box-shadow:
      inset 0 -0.5cqw 1cqw rgb(0 0 0 / .12),
      0 0.6cqw 2.4cqw rgb(0 0 0 / .42),
      0 0 0.8cqw rgb(0 0 0 / .22);
    transform: translate3d(calc(var(--dx) * 1cqw), calc(var(--dy) * 1cqw), var(--lift)) scale(var(--s));
    transition: transform .55s var(--ease), box-shadow .55s var(--ease), filter .55s var(--ease);
    will-change: transform;
  }
  .sphere::after {             /* indicador de seleção */
    content: ""; position: absolute; inset: -1.6cqw; border-radius: 50%;
    border: .5cqw solid rgb(255 255 255 / .9);
    box-shadow: 0 0 1.6cqw rgb(255 255 255 / .35);
    opacity: 0; transform: scale(.88);
    transition: opacity .35s var(--ease), transform .45s var(--ease);
    pointer-events: none;
  }
  .sphere[aria-checked="true"]::after { opacity: 1; transform: scale(1); }

  .sphere.is-hover {
    filter: brightness(1.05);
    box-shadow:
      inset 0 -0.5cqw 1cqw rgb(0 0 0 / .12),
      0 2.4cqw 4.4cqw rgb(0 0 0 / .55),
      0 0.4cqw 0.8cqw rgb(0 0 0 / .45);
  }
  .sphere:focus-visible {
    outline: .6cqw solid #fff; outline-offset: .8cqw;
  }
  .sphere:focus-visible.is-hover { outline-offset: .8cqw; }

  @media (prefers-reduced-motion: reduce) {
    .sphere, .sphere::after, .sphere-picker::before, .sphere-picker::after { transition-duration: .01s; }
  }
</style>
</head>
<body>

<div class="sphere-picker" id="picker" role="radiogroup" aria-label="Cor"></div>

<script>
(() => {
  // Composição medida na imagem de referência (aro = 100% do diâmetro):
  // 12 pétalas externas a 30,6% do centro (d 24%), 6 pastéis a 18,3% (d 21,5%), centro branco (d 22,5%).
  const polar = (r, deg) => [50 + r * Math.sin(deg * Math.PI / 180), 50 - r * Math.cos(deg * Math.PI / 180)];
  const OUTER = [  // sentido horário a partir do topo; marrom fica por baixo, o resto sobrepõe em cata-vento
    ['Marrom',   '#6a2f26'], ['Coral',   '#f4733a'], ['Âmbar',    '#ffb02a'], ['Lima',   '#a7d92e'],
    ['Verde',    '#2ed85a'], ['Esmeralda','#14b98b'], ['Turquesa', '#139fb1'], ['Azul',   '#3a6fd8'],
    ['Violeta',  '#6a4fd0'], ['Magenta', '#b83cc8'], ['Rosa',     '#e8357f'], ['Vermelho','#f0405a'],
  ];
  const INNER = [
    ['Cinza claro',  '#d0d3d6'], ['Creme',  '#f1eec6'], ['Menta',  '#cdeed9'],
    ['Cinza azulado','#b4c4d6'], ['Lavanda','#b3acd9'], ['Rosa claro','#efc4dc'],
  ];
  const COLORS = [
    ...OUTER.map(([n, c], i) => [n, c, ...polar(30.6, i * 30), 24, i === 0 ? 1 : 1 + i]),
    ...INNER.map(([n, c], i) => [n, c, ...polar(18.3, i * 60), 21.5, 20 + i]),
    ['Branco', '#ffffff', 50, 50, 22.5, 30],
  ];

  const picker = document.getElementById('picker');
  const items = COLORS.map(([name, color, x, y, d, z], i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'sphere';
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', 'false');
    b.setAttribute('aria-label', name);
    b.tabIndex = i === 0 ? 0 : -1;
    b.style.cssText = `--c:${color};--x:${x}%;--y:${y}%;--d:${d}%;--z:${z}`;
    picker.appendChild(b);
    return { el: b, name, color, x, y, d, z };
  });

  const MAX_R = 47;              // limite (em % do diâmetro) das esferas
  const REACH = 26, PUSH = 3.4;  // alcance e força do afastamento
  let hovered = null;

  function layout(h) {
    items.forEach(it => {
      const s = it.el.style;
      if (!h) {
        s.setProperty('--dx', 0); s.setProperty('--dy', 0);
        s.setProperty('--s', 1);  s.setProperty('--lift', '0px');
        it.el.classList.remove('is-hover');
        s.zIndex = '';
        return;
      }
      if (it === h) {
        s.setProperty('--dx', 0); s.setProperty('--dy', 0);
        s.setProperty('--s', 1.16); s.setProperty('--lift', '40px');
        it.el.classList.add('is-hover');
        s.zIndex = 50;
        return;
      }
      it.el.classList.remove('is-hover');
      s.zIndex = '';
      let vx = it.x - h.x, vy = it.y - h.y;
      const dist = Math.hypot(vx, vy) || 1;
      const k = Math.max(0, 1 - dist / REACH);
      const p = PUSH * k * k * (2 - k);     // easing de queda
      let dx = vx / dist * p, dy = vy / dist * p;
      // mantém dentro do aro
      const nx = it.x + dx - 50, ny = it.y + dy - 50;
      const r = Math.hypot(nx, ny), lim = MAX_R - it.d / 2;
      if (r > lim) { dx -= nx / r * (r - lim); dy -= ny / r * (r - lim); }
      s.setProperty('--dx', dx.toFixed(2)); s.setProperty('--dy', dy.toFixed(2));
      s.setProperty('--s', 1 - 0.03 * k);
      s.setProperty('--lift', '0px');
    });
  }

  function select(it) {
    items.forEach(o => {
      const on = o === it;
      o.el.setAttribute('aria-checked', on);
      o.el.tabIndex = on ? 0 : -1;
    });
    picker.dataset.value = it.color;
    picker.style.setProperty('--selected-color', it.color);
    picker.dispatchEvent(new CustomEvent('colorchange', { detail: { name: it.name, color: it.color }, bubbles: true }));
  }

  items.forEach((it, i) => {
    const el = it.el;
    el.addEventListener('pointerenter', () => { hovered = it; layout(it); });
    el.addEventListener('focus', () => { if (!picker.matches(':hover')) layout(it); });
    el.addEventListener('blur',  () => { if (!picker.matches(':hover')) layout(null); });
    el.addEventListener('click', () => select(it));
    el.addEventListener('keydown', e => {
      const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
      if (!step) return;
      e.preventDefault();
      const n = items[(i + step + items.length) % items.length];
      n.el.focus(); select(n);
    });
  });
  picker.addEventListener('pointerleave', () => { hovered = null; layout(null); });

  // exemplo de integração
  picker.addEventListener('colorchange', e => console.log('cor selecionada:', e.detail));
})();
</script>
</body>
</html>
