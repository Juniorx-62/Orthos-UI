.ac-chips { display: contents; margin: 0; padding: 0; list-style: none; }
.ac-chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 2px 0 8px; border-radius: 999px; background: var(--ac-surface-2); border: 1px solid var(--ac-border); color: var(--ac-text); font: 500 var(--ac-fs-sm) var(--ac-font); animation: ac-pop-sm .2s var(--ac-ease-spring); }
.ac-chip .ac-avatar { width: 22px; height: 22px; margin-left: -6px; font-size: var(--ac-fs-xs); box-shadow: none; }
.ac-chip button { display: grid; place-items: center; width: 24px; height: 24px; border: 0; border-radius: 50%; background: none; color: var(--ac-text-3); cursor: pointer; }
.ac-chip button:hover, .ac-chip button:focus-visible { background: var(--ac-surface-3); color: var(--ac-text); outline: none; }
.ac-chip button .ac-icon { width: 12px; height: 12px; }
.ac-chips-field__input { flex: 1; min-width: 120px; height: 28px; border: 0; background: none; color: var(--ac-text); font: var(--ac-fs-base) var(--ac-font); outline: none; }

/* ---------- Date range ---------- */
.ac-range { display: flex; width: max-content; max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); overflow: auto; padding: 0; }
.ac-range__presets, .ac-range__cals { flex: none; }
.ac-range__presets { display: grid; align-content: start; gap: 2px; padding: 8px; border-right: 1px solid var(--ac-border); min-width: 150px; }
.ac-range__cals { position: relative; padding: 4px 4px 10px; }
.ac-range__nav { position: absolute; inset: 12px 12px auto; display: flex; justify-content: space-between; pointer-events: none; }
.ac-range__nav .ac-btn { pointer-events: auto; }
.ac-range__months { display: flex; }
.ac-range .ac-cal__head { justify-content: center; height: 32px; }
.ac-range .ac-cal__day[data-in] { background: var(--ac-surface-2); border-radius: 0; }
.ac-range__hint { margin: 0 12px; font: var(--ac-fs-sm) var(--ac-font); color: var(--ac-text-3); }
@media (max-width: 760px) { .ac-range { flex-direction: column; } .ac-range__presets { grid-template-columns: repeat(3, 1fr); border-right: 0; border-bottom: 1px solid var(--ac-border); } .ac-range__second { display: none; } }

/* ---------- Gráficos: área, barras horizontais, meta, empilhada ---------- */
.ac-area { display: grid; gap: 10px; font-family: var(--ac-font); }
.ac-area__plot { position: relative; height: 200px; border-radius: 8px; }
.ac-area__plot:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ac-ring); }
.ac-area svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ac-area .g { stroke: var(--ac-border); stroke-dasharray: 2 4; }
.ac-area .fill { fill: var(--ac-text); opacity: .07; }
.ac-area .ln { fill: none; stroke: var(--ac-text); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: ac-draw 1.1s var(--ac-ease) forwards; }
.ac-area .cmp { fill: none; stroke: var(--ac-text-3); stroke-width: 1.5; stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; }
.ac-area .cur { stroke: var(--ac-border-strong); vector-effect: non-scaling-stroke; }
.ac-area__dot { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--ac-surface); border: 2px solid var(--ac-text); pointer-events: none; }
.ac-area__tip { position: absolute; top: -6px; display: grid; gap: 2px; padding: 8px 10px; border-radius: 8px; background: var(--ac-text); color: var(--ac-bg); font-size: var(--ac-fs-xs); pointer-events: none; white-space: nowrap; box-shadow: var(--ac-shadow); }
.ac-area__tip .c { opacity: .7; }
.ac-area__foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ac-area__legend { display: inline-flex; align-items: center; gap: 6px; font-size: var(--ac-fs-sm); color: var(--ac-text-3); }
.ac-area__legend i { width: 14px; height: 2px; background: var(--ac-text); }
.ac-area__legend i.c { margin-left: 8px; background: repeating-linear-gradient(90deg, var(--ac-text-3) 0 4px, transparent 4px 7px); }
.ac-hbars { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; font: var(--ac-fs-sm) var(--ac-font); }
.ac-hbars li { display: grid; grid-template-columns: minmax(80px, 30%) 1fr auto; align-items: center; gap: 12px; color: var(--ac-text-2); }
.ac-hbars__track { height: 10px; border-radius: 99px; background: var(--ac-surface-2); overflow: hidden; }
.ac-hbars__bar { display: block; height: 100%; width: var(--v); border-radius: inherit; background: var(--ac-text); transform-origin: left; animation: ac-grow-x .8s var(--ac-ease) both; }
.ac-hbars b { font-weight: 600; color: var(--ac-text); font-variant-numeric: tabular-nums; }
.ac-goal { display: grid; gap: 8px; font: var(--ac-fs-sm) var(--ac-font); }
.ac-goal__row { display: flex; justify-content: space-between; color: var(--ac-text-2); }
.ac-goal__row b { color: var(--ac-text); }
.ac-goal__track { position: relative; height: 10px; border-radius: 99px; background: var(--ac-surface-2); }
.ac-goal__track::before { content: ""; position: absolute; inset: 0 auto 0 0; width: min(var(--v), 100%); border-radius: inherit; background: var(--ac-text); transition: width .6s var(--ac-ease); }
.ac-goal__track::after { content: ""; position: absolute; top: -4px; bottom: -4px; left: var(--goal); width: 2px; border-radius: 2px; background: var(--ac-accent); }
.ac-goal[data-hit] .ac-goal__track::before { background: var(--ac-success); }
.ac-stack { display: grid; gap: 10px; font: var(--ac-fs-sm) var(--ac-font); }
.ac-stack__bar { display: flex; height: 12px; gap: 2px; border-radius: 99px; overflow: hidden; }
.ac-stack__bar span { flex: var(--v); background: var(--c); }
.ac-stack__legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0; padding: 0; list-style: none; color: var(--ac-text-2); }
.ac-stack__legend li { display: inline-flex; align-items: center; gap: 6px; }
.ac-stack__legend li::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.ac-stack__legend b { color: var(--ac-text); font-variant-numeric: tabular-nums; }

/* ---------- Cartão recolhível ---------- */
.ac-collapsible { border: 1px solid var(--ac-border); border-radius: var(--ac-r-lg); background: var(--ac-surface); font-family: var(--ac-font); }
.ac-collapsible__head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
.ac-collapsible__head h4 { margin: 0; font-size: var(--ac-fs-md); }
.ac-collapsible__head p { margin: 2px 0 0; font-size: var(--ac-fs-sm); color: var(--ac-text-3); }
.ac-collapsible__head [data-ac-trigger] { margin-left: auto; }
.ac-collapsible__head [data-ac-trigger] .ac-icon { transition: transform var(--ac-dur-base) var(--ac-ease-standard); }
.ac-collapsible.is-open [data-ac-trigger] .ac-icon { transform: rotate(180deg); }
.ac-collapsible__panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--ac-dur-slow) var(--ac-ease); }
.ac-collapsible.is-open .ac-collapsible__panel { grid-template-rows: 1fr; }
.ac-collapsible__panel > div { overflow: hidden; }
.ac-datarow { display: flex; justify-content: space-between; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--ac-border); font-size: var(--ac-fs-base); }
.ac-datarow span { color: var(--ac-text-3); }

/* ---------- Página de resultado / erro ---------- */
.ac-result { display: grid; justify-items: center; gap: 8px; max-width: 460px; margin: 0 auto; padding: 32px 16px; text-align: center; font-family: var(--ac-font); }
.ac-result__icon { position: relative; display: grid; place-items: center; width: 64px; height: 64px; margin-bottom: 10px; border-radius: 18px; border: 1px solid var(--ac-border); background: var(--ac-surface); box-shadow: var(--ac-shadow); color: var(--ac-text); }
.ac-result__icon .ac-icon { width: 26px; height: 26px; }
.ac-result__icon::after { content: ""; position: absolute; right: -5px; bottom: -5px; width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--ac-bg); background: var(--ac-text-3); }
.ac-result[data-tone="danger"] .ac-result__icon::after { background: var(--ac-danger); }
.ac-result[data-tone="success"] .ac-result__icon { color: var(--ac-success); }
.ac-result[data-tone="success"] .ac-result__icon::after { background: var(--ac-success); }
.ac-result__code { margin: 0; font: 600 var(--ac-fs-xs) var(--ac-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ac-text-3); }
.ac-result__title { margin: 0; font: 650 var(--ac-fs-2xl)/1.25 var(--ac-font); letter-spacing: -.02em; color: var(--ac-text); }
.ac-result__text { margin: 0 0 10px; font-size: var(--ac-fs-md); line-height: 1.55; color: var(--ac-text-2); }
.ac-result__actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

/* alvo mínimo de toque (WCAG 2.5.8) para controles compactos */
@media (pointer: coarse) { .ac-btn--sm, .ac-toggle, .ac-menubar__trigger, .ac-pager button { min-height: 32px; } }
@keyframes ac-grow-x { from { transform: scaleX(0); } }

/* ---------- Carregamento com logo ---------- */
.ac-logo-load { --size: 88px; --cycle: 3.2s; display: inline-grid; place-items: center; width: var(--size); height: var(--size); flex: none; color: var(--ac-text); }
.ac-logo-load__svg { width: 100%; height: 100%; overflow: visible; }
.ac-logo-load__base { opacity: .18; animation: ac-logo-breathe 1.6s ease-in-out infinite; }
.ac-logo-load__fill { opacity: 0; animation: ac-logo-fill var(--cycle) cubic-bezier(.4, 0, .2, 1) infinite; }
.ac-logo-load__shine { opacity: .35; transform: translate(calc(var(--d) * -1px), calc(var(--d) * -1px)); animation: ac-logo-shine var(--cycle) cubic-bezier(.45, 0, .55, 1) infinite; }
.ac-logo-load__trace { stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 1.02; stroke-dashoffset: 1.01; animation: ac-logo-trace var(--cycle) cubic-bezier(.65, 0, .35, 1) infinite; }
/* imagem (PNG, JPG, WebP): a silhueta se revela no lugar do traço, o logo aparece e o brilho passa só por ele */
.ac-logo-load__img { position: relative; display: block; width: 100%; height: 100%; }
.ac-logo-load__img > * { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.ac-logo-load__img .b { filter: grayscale(1); opacity: .18; animation: ac-logo-breathe 1.6s ease-in-out infinite; }
.ac-logo-load__img .d { filter: brightness(0); opacity: .85; clip-path: inset(0 100% 0 0); animation: ac-logo-wipe var(--cycle) cubic-bezier(.65, 0, .35, 1) infinite; }
:root[data-theme="dark"] .ac-logo-load__img .d { filter: brightness(0) invert(1); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ac-logo-load__img .d { filter: brightness(0) invert(1); } }
.ac-logo-load__img .f { opacity: 0; animation: ac-logo-fill var(--cycle) cubic-bezier(.4, 0, .2, 1) infinite; }
.ac-logo-load__img .s { background: linear-gradient(135deg, transparent 38%, rgb(255 255 255 / .85) 50%, transparent 62%) no-repeat; background-size: 300% 300%; -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; opacity: 0; animation: ac-logo-shine-img var(--cycle) cubic-bezier(.45, 0, .55, 1) infinite, ac-logo-fill var(--cycle) cubic-bezier(.4, 0, .2, 1) infinite; }
.ac-loading-screen { position: fixed; inset: 0; z-index: 3000; display: grid; place-items: center; background: color-mix(in oklab, var(--ac-bg) 84%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); opacity: 0; visibility: hidden; transition: opacity .2s ease-out, visibility 0s linear .2s; }
.ac-loading-screen[data-on="true"] { opacity: 1; visibility: visible; transition: opacity .2s ease-out, visibility 0s; }
.ac-logo-stage { display: grid; place-items: center; width: 200px; height: 200px; border-radius: 28px; border: 1px solid var(--ac-border); background: var(--ac-surface); box-shadow: var(--ac-shadow); }
@keyframes ac-logo-trace { 0% { stroke-dashoffset: 1.01; } 35%, 75% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -1.01; } }
@keyframes ac-logo-fill { 0%, 34% { opacity: 0; } 52%, 68% { opacity: 1; } 86%, 100% { opacity: 0; } }
@keyframes ac-logo-shine { 0%, 44% { transform: translate(calc(var(--d) * -1px), calc(var(--d) * -1px)); } 80%, 100% { transform: translate(calc(var(--d) * 1px), calc(var(--d) * 1px)); } }
@keyframes ac-logo-shine-img { 0%, 44% { background-position: 100% 100%; } 80%, 100% { background-position: 0% 0%; } }
@keyframes ac-logo-wipe { 0% { clip-path: inset(0 100% 0 0); } 35%, 75% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 0 0 100%); } }
@keyframes ac-logo-breathe { 0%, 100% { opacity: .18; } 50% { opacity: .32; } }
/* com movimento reduzido, só o logo parado (a regra geral de .ac encurta animações e deixaria o logo no quadro final, apagado) */
@media (prefers-reduced-motion: reduce) {
  .ac-logo-load__fill, .ac-logo-load__img .f { animation: none !important; opacity: 1 !important; }
  .ac-logo-load__trace, .ac-logo-load__shine, .ac-logo-load__img .d, .ac-logo-load__img .s { animation: none !important; opacity: 0 !important; }
  .ac-logo-load__base, .ac-logo-load__img .b { animation: none !important; }
}

/* ======================= Componentes de 27/10/2026 ======================= */

/* ---------- Barra de alterações não salvas ---------- */
.ac-savebar { position: sticky; bottom: 16px; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; width: 100%; padding: 10px 10px 10px 16px; border: 1px solid var(--ac-border); border-radius: var(--ac-r-full); background: color-mix(in oklab, var(--ac-surface) 92%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: var(--ac-shadow-lg); font: var(--ac-fs-base) var(--ac-font); opacity: 0; visibility: hidden; transform: translateY(12px) scale(.98); transition: opacity var(--ac-dur-base) var(--ac-ease-standard), transform var(--ac-dur-slow) var(--ac-ease-spring), visibility 0s linear var(--ac-dur-base); }
.ac-savebar.is-on { opacity: 1; visibility: visible; transform: none; transition: opacity var(--ac-dur-base) var(--ac-ease-standard), transform var(--ac-dur-slow) var(--ac-ease-spring), visibility 0s; }
.ac-savebar__hint { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--ac-text-2); }
.ac-savebar__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ac-warning); box-shadow: 0 0 0 0 var(--ac-warning); animation: ac-pulse 1.8s var(--ac-ease) infinite; }
.ac-savebar__actions { display: flex; gap: 8px; margin-left: auto; }

/* ---------- Campo de dinheiro ---------- */
.ac-money { --cell: 1.4em; --bleed: calc((var(--cell) - .86em) / 2); display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-family: var(--ac-font); }
.ac-money__label { margin: 0; color: var(--ac-text-3); font-size: var(--ac-fs-sm); font-weight: 500; }
.ac-money__stage { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 68px; padding: 0 12px; border-radius: 12px; color: var(--ac-text); font-size: clamp(40px, 11vw, 56px); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.035em; line-height: 1; cursor: text; }
.ac-money__stage:focus-within { box-shadow: 0 0 0 3px var(--ac-ring); }
.ac-money__field { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; padding: 0; border: 0; background: transparent; color: transparent; font-size: 16px; caret-color: transparent; opacity: 0; cursor: text; }
.ac-money__value { position: relative; display: inline-flex; align-items: center; height: var(--cell); }
.ac-money__placeholder { position: relative; display: inline-flex; align-items: baseline; line-height: var(--cell); color: var(--ac-text-3); opacity: .5; white-space: nowrap; }
.ac-money.is-filled .ac-money__placeholder, .ac-money:not(.is-filled) .ac-money__display { display: none; }
.ac-money__display { position: relative; display: inline-flex; align-items: baseline; white-space: nowrap; }
.ac-money__row { position: relative; display: inline-flex; flex: none; align-items: baseline; }
.ac-money__affix { position: absolute; top: 50%; right: 100%; margin-inline-end: .2em; color: var(--ac-text-3); font-size: .62em; font-weight: 500; letter-spacing: 0; line-height: 1; white-space: nowrap; translate: 0 -50%; }
.ac-money__mark { display: inline-block; white-space: pre; }
.ac-money__slot { position: relative; display: inline-block; }
.ac-money__slot::before { content: "0"; display: block; height: var(--cell); line-height: var(--cell); visibility: hidden; }
.ac-money__window { position: absolute; inset: calc(var(--bleed) * -1) 0; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--bleed), #000 calc(100% - var(--bleed)), transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 var(--bleed), #000 calc(100% - var(--bleed)), transparent 100%); }
.ac-money__strip { position: absolute; top: var(--bleed); left: 0; width: 100%; transform: translateY(calc(var(--at, 10) * var(--cell) * -1)); }
.ac-money__cell { display: block; height: var(--cell); line-height: var(--cell); text-align: center; }
.ac-money__slot[data-arriving], .ac-money__mark[data-arriving] { animation: ac-money-in 240ms linear var(--wait, 0ms) both; }
.ac-money__slot[data-leaving], .ac-money__mark[data-leaving] { position: absolute; top: 0; pointer-events: none; animation: ac-money-out 240ms cubic-bezier(.4, 0, 1, 1) forwards; }
.ac-money__caret { position: absolute; top: 50%; left: 100%; width: 2px; height: .82em; margin-inline-start: .06em; border-radius: 1px; background: var(--ac-text); opacity: 0; translate: 0 -50%; pointer-events: none; }
.ac-money__stage:focus-within .ac-money__caret { animation: ac-money-caret 1.1s steps(1, end) infinite; }
.ac-money__hint { min-height: 18px; margin: 0 0 4px; color: var(--ac-text-3); font-size: var(--ac-fs-sm); line-height: 18px; }
.ac-money.is-invalid .ac-money__display, .ac-money.is-invalid .ac-money__hint, .ac-money.is-invalid .ac-money__affix { color: var(--ac-danger); }
.ac-money__max { height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--ac-surface-2); color: var(--ac-text); font: 500 var(--ac-fs-xs) var(--ac-font); cursor: pointer; transition: background var(--ac-dur-fast); }
.ac-money__max:hover { background: var(--ac-surface-3); }
.ac-money__max:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ac-ring); }
@keyframes ac-money-in { 0% { opacity: 0; filter: blur(.09em); transform: translateY(calc(var(--bleed) * -.5)) scaleX(.55); } 45% { opacity: .14; } 78% { opacity: .62; } 100% { opacity: 1; filter: blur(0); transform: none; } }
@keyframes ac-money-out { to { opacity: 0; filter: blur(.09em); } }
@keyframes ac-money-caret { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

/* ---------- Telefone com país ---------- */
.ac-phone { display: flex; align-items: stretch; height: 40px; border: 1px solid var(--ac-border-strong); border-radius: var(--ac-r-sm); background: var(--ac-surface); overflow: hidden; transition: border-color var(--ac-dur-fast), box-shadow var(--ac-dur-fast); }
.ac-phone:focus-within { border-color: var(--ac-accent); box-shadow: 0 0 0 3px var(--ac-ring); }
.ac-phone:has(.ac-phone__input[aria-invalid="true"]) { border-color: var(--ac-danger); }
.ac-phone__country { display: inline-flex; align-items: center; gap: 6px; padding: 0 8px 0 10px; border: 0; border-right: 1px solid var(--ac-border); background: var(--ac-surface-2); color: var(--ac-text); font: 500 var(--ac-fs-base) var(--ac-font); cursor: pointer; }
.ac-phone__country:focus-visible { outline: none; background: var(--ac-surface-3); }
.ac-phone__country .ac-icon { width: 14px; height: 14px; color: var(--ac-text-3); }
.ac-phone__iso { display: inline-grid; place-items: center; min-width: 26px; height: 18px; padding: 0 4px; border-radius: 4px; background: var(--ac-surface-3); color: var(--ac-text-2); font: 600 var(--ac-fs-xs) var(--ac-mono); letter-spacing: .04em; }
.ac-phone__ddi { font-variant-numeric: tabular-nums; }
.ac-phone__input { flex: 1; min-width: 0; padding: 0 12px; border: 0; background: none; color: var(--ac-text); font: var(--ac-fs-base) var(--ac-font); font-variant-numeric: tabular-nums; outline: none; }

/* ---------- Abas que transbordam ---------- */
.ac-tabs__frame { position: relative; border-bottom: 1px solid var(--ac-border); }
.ac-tabs__list { border-bottom: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; scroll-behavior: auto; flex-wrap: nowrap; }
.ac-tabs__list::-webkit-scrollbar, .ac-segmented::-webkit-scrollbar { display: none; }
.ac-tabs__tab { flex: none; white-space: nowrap; }
.ac-tabs__ink { bottom: 0; }
.ac-tabs__list[data-overflow-start] { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 48px); mask-image: linear-gradient(90deg, transparent 0, #000 48px); }
.ac-tabs__list[data-overflow-end] { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 48px), transparent 100%); mask-image: linear-gradient(90deg, #000 calc(100% - 48px), transparent 100%); }
.ac-tabs__list[data-overflow-start][data-overflow-end] { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 48px, #000 calc(100% - 48px), transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 48px, #000 calc(100% - 48px), transparent 100%); }
.ac-tabs__scroll { position: absolute; top: 50%; z-index: 1; display: grid; place-items: center; width: 26px; height: 26px; margin-top: -13px; border: 1px solid var(--ac-border); border-radius: 50%; background: var(--ac-surface); color: var(--ac-text-2); box-shadow: var(--ac-shadow-sm); cursor: pointer; transition: opacity var(--ac-dur-fast); }
.ac-tabs__scroll .ac-icon { width: 14px; height: 14px; }
.ac-tabs__scroll--start { left: 0; } .ac-tabs__scroll--end { right: 0; }
.ac-tabs__scroll[aria-hidden="true"] { opacity: 0; pointer-events: none; }
@media (pointer: coarse) { .ac-tabs__scroll { display: none; } }

/* ---------- Tour de apresentação ---------- */
.ac-tour__spot { position: fixed; z-index: 2400; border-radius: 12px; box-shadow: 0 0 0 9999px rgb(8 8 10 / .55), 0 0 0 2px rgb(255 255 255 / .7); pointer-events: auto; transition: left var(--ac-dur-slow) var(--ac-ease), top var(--ac-dur-slow) var(--ac-ease), width var(--ac-dur-slow) var(--ac-ease), height var(--ac-dur-slow) var(--ac-ease); }
.ac-tour__spot.is-center { box-shadow: 0 0 0 9999px rgb(8 8 10 / .55); }
.ac-tour__tip { position: fixed; z-index: 2401; width: min(320px, calc(100vw - 16px)); padding: 16px; border: 1px solid var(--ac-border); border-radius: var(--ac-r-lg); background: var(--ac-surface); color: var(--ac-text); box-shadow: var(--ac-shadow-lg); font: var(--ac-fs-base)/1.5 var(--ac-font); outline: none; animation: ac-pop-sm .25s var(--ac-ease-spring); transition: left var(--ac-dur-slow) var(--ac-ease), top var(--ac-dur-slow) var(--ac-ease); }
.ac-tour__head { display: flex; align-items: center; justify-content: space-between; margin: -4px -6px 4px 0; }
.ac-tour__count { font: 600 var(--ac-fs-xs) var(--ac-mono); letter-spacing: .04em; color: var(--ac-text-3); text-transform: uppercase; }
.ac-tour__title { margin: 0 0 4px; font: 600 var(--ac-fs-md)/1.3 var(--ac-font); letter-spacing: -.01em; }
.ac-tour__text { margin: 0 0 14px; color: var(--ac-text-2); font-size: var(--ac-fs-base); }
.ac-tour__foot { display: flex; align-items: center; gap: 8px; }
.ac-tour__foot .ac-btn:last-child { margin-left: 0; }
.ac-tour__dots { display: flex; gap: 4px; margin-right: auto; }
.ac-tour__dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--ac-border-strong); transition: width var(--ac-dur-base) var(--ac-ease), background var(--ac-dur-base); }
.ac-tour__dots i.on { width: 16px; border-radius: 3px; background: var(--ac-text); }

/* ---------- Sidebar redimensionável ---------- */
.ac-sidebar { position: relative; }
.ac-sidebar__resize { position: absolute; top: 0; right: 0; bottom: 0; width: 8px; cursor: col-resize; touch-action: none; }
.ac-sidebar__resize::after { content: ""; position: absolute; top: 12px; bottom: 12px; right: 3px; width: 2px; border-radius: 2px; background: transparent; transition: background var(--ac-dur-fast); }
.ac-sidebar__resize:hover::after, .ac-sidebar.is-resizing .ac-sidebar__resize::after { background: var(--ac-accent); }
.ac-sidebar__resize:focus-visible { outline: none; }
.ac-sidebar__resize:focus-visible::after { background: var(--ac-accent); box-shadow: 0 0 0 3px var(--ac-ring); }
.ac-sidebar.is-resizing { transition: none; user-select: none; }
@media (prefers-reduced-motion: reduce) { .ac-tour__spot, .ac-tour__tip { transition: none; } .ac-savebar { transition: none; } }

/* ======================= Pesquisa de 28/10/2026 ======================= */

/* ---------- Carrossel ---------- */
.ac-carousel { --slide: 100%; --gap: 12px; position: relative; display: grid; gap: 12px; min-width: 0; font-family: var(--ac-font); }
.ac-carousel__track { position: relative; display: flex; gap: var(--gap); margin: 0; padding: 0; list-style: none; overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory; scrollbar-width: none; border-radius: var(--ac-r-lg); }
.ac-carousel__track::-webkit-scrollbar { display: none; }
.ac-carousel__track:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ac-ring); }
.ac-carousel__slide { flex: 0 0 var(--slide); min-width: 0; scroll-snap-align: start; }
.ac-carousel__controls { justify-self: center; display: inline-flex; align-items: center; gap: 2px; max-width: 100%; padding: 3px; border: 1px solid var(--ac-border); border-radius: var(--ac-r-full); background: var(--ac-surface); box-shadow: var(--ac-shadow-sm); }
.ac-carousel__btn { display: grid; place-items: center; width: 30px; height: 30px; flex: none; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--ac-text-2); cursor: pointer; transition: background var(--ac-dur-fast), color var(--ac-dur-fast); }
.ac-carousel__btn:hover { background: var(--ac-surface-2); color: var(--ac-text); }
.ac-carousel__btn:focus-visible, .ac-carousel__dot:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ac-ring); }
.ac-carousel__btn[data-paused="false"] .ac-icon:last-child, .ac-carousel__btn[data-paused="true"] .ac-icon:first-child { display: none; }
.ac-carousel__btn[data-car="pause"] .ac-icon { width: 14px; height: 14px; }
.ac-carousel__dots { display: flex; align-items: center; min-width: 0; }
.ac-carousel__dot { display: grid; place-items: center; width: 24px; height: 24px; flex: none; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; }
.ac-carousel__dot::before { content: ""; width: 6px; height: 6px; border-radius: 99px; background: var(--ac-border-strong); transition: width var(--ac-dur-base) var(--ac-ease), background var(--ac-dur-base); }
.ac-carousel__dot:hover::before { background: var(--ac-text-3); }
.ac-carousel__dot[aria-current="true"]::before { width: 16px; background: var(--ac-text); }

/* ---------- Tabela em cartões ----------
   Quando o espaço da tabela (não a tela) fica abaixo de 640 px, cada <tr> vira um cartão e cada <td> uma linha
   "rótulo: valor" (o rótulo vem de data-label): no celular, mas também num painel lateral ou numa coluna estreita.
   Célula sem data-label ocupa a linha inteira (título do cartão); .ac-table__actions vira a última linha, à direita.
   O contêiner medido é o .ac-table-wrap (ou o pai marcado com .ac-stack-host, que o data-ac="stack" põe sozinho). */
.ac-table-wrap:has(.ac-table--stack), .ac-stack-host { container: ac-table / inline-size; }
@container ac-table (max-width: 640px) {
  .ac-table--stack, .ac-table--stack tbody, .ac-table--stack tr { display: block; }
  .ac-table--stack thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .ac-table--stack tbody { display: grid; gap: 10px; padding: 10px; }
  .ac-table--stack tbody tr { position: relative; display: grid; min-width: 0; border: 1px solid var(--ac-border); border-radius: var(--ac-r); background: var(--ac-surface); box-shadow: var(--ac-shadow-sm); }
  .ac-table--stack tbody tr:hover { background: var(--ac-surface); }
  .ac-table.ac-table--stack tbody td { display: grid; grid-template-columns: minmax(0, 1fr) fit-content(65%); align-items: center; gap: 12px; height: auto; min-height: 40px; padding: 8px 14px; border-bottom: 1px solid var(--ac-border); white-space: normal; text-align: right; overflow-wrap: anywhere; }
  .ac-table--stack td[data-label]::before { content: attr(data-label); color: var(--ac-text-3); font-size: var(--ac-fs-sm); text-align: left; overflow-wrap: normal; }
  .ac-table.ac-table--stack tbody td:last-child { border-bottom: 0; }
  .ac-table.ac-table--stack tbody td:not([data-label]) { display: block; text-align: left; }
  .ac-table.ac-table--stack tbody td.ac-table__actions { order: 1; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; border-bottom: 0; }
  .ac-table.ac-table--stack tbody td.ac-table__select { position: absolute; top: 4px; right: 4px; z-index: 1; min-height: 0; padding: 0; border: 0; }
  .ac-table--stack .ac-table__select .ac-check { padding: 7px; }
  .ac-table--stack tbody tr:has(> .ac-table__select) > td:not([data-label]):not(.ac-table__select) { padding-right: 48px; }
}

/* ---------- Campo de senha ---------- */
.ac-password { position: relative; display: flex; align-items: center; min-width: 0; }
.ac-password > .ac-input { padding-right: 44px; }
.ac-password__toggle { position: absolute; right: 4px; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 6px; background: none; color: var(--ac-text-3); cursor: pointer; transition: background var(--ac-dur-fast), color var(--ac-dur-fast); }
.ac-password__toggle:hover { background: var(--ac-surface-2); color: var(--ac-text); }
.ac-password__toggle:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ac-ring); }
.ac-password__toggle[aria-pressed="false"] .ac-icon:last-child, .ac-password__toggle[aria-pressed="true"] .ac-icon:first-child { display: none; }
.ac-password__rules { display: grid; gap: 4px; margin: 2px 0 0; padding: 0; list-style: none; font: var(--ac-fs-sm)/1.4 var(--ac-font); color: var(--ac-text-2); }
.ac-password__rules[hidden] { display: none; }
.ac-password__rules li { display: flex; align-items: center; gap: 6px; }
.ac-password__rules .ac-icon { width: 14px; height: 14px; }
.ac-password__ok { color: var(--ac-success); }
.ac-password__no { color: var(--ac-text-3); }
.ac-password__rules li[data-ok="true"] .ac-password__no, .ac-password__rules li[data-ok="false"] .ac-password__ok { display: none; }
.ac-password__rules li[data-ok="true"] { color: var(--ac-text); }
.ac-field:has(.ac-password [aria-invalid="true"]) .ac-password__rules li[data-ok="false"], .ac-field:has(.ac-password [aria-invalid="true"]) .ac-password__no { color: var(--ac-danger); }

/* ---------- Linha do tempo ---------- */
.ac-timeline { margin: 0; padding: 0; list-style: none; font-family: var(--ac-font); }
.ac-timeline__item { position: relative; display: grid; grid-template-columns: 32px minmax(0, 1fr); align-content: start; gap: 0 12px; padding-bottom: 20px; }
.ac-timeline__item:last-child { padding-bottom: 0; }
.ac-timeline__item::before { content: ""; position: absolute; top: 32px; bottom: 0; left: 15.5px; width: 1px; background: var(--ac-border-strong); }
.ac-timeline__item:last-child::before { content: none; }
.ac-timeline__item.is-done::before { background: color-mix(in oklab, var(--ac-success) 45%, var(--ac-border)); }
.ac-timeline__node { position: relative; z-index: 1; display: grid; place-items: center; width: 32px; height: 32px; border: 1px solid var(--ac-border-strong); border-radius: 8px; background: var(--ac-surface); color: var(--ac-text-2); }
.ac-timeline__node .ac-icon { width: 16px; height: 16px; }
.is-done > .ac-timeline__node { border-color: transparent; background: var(--ac-success-bg); color: var(--ac-success); }
.is-current > .ac-timeline__node { border-color: transparent; background: var(--ac-warning-bg); color: var(--ac-warning); box-shadow: 0 0 0 4px color-mix(in oklab, var(--ac-warning) 14%, transparent); }
.is-failed > .ac-timeline__node { border-color: transparent; background: var(--ac-danger-bg); color: var(--ac-danger); }
.is-next > .ac-timeline__node { border-style: dashed; background: transparent; color: var(--ac-text-3); }
.ac-timeline__body { display: grid; align-content: start; gap: 2px; min-width: 0; padding-top: 1px; }
.ac-timeline__date { font-size: var(--ac-fs-xs); line-height: 1.4; color: var(--ac-text-3); font-variant-numeric: tabular-nums; }
.ac-timeline__head { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; }
.ac-timeline__title { margin: 0; font: 600 var(--ac-fs-base)/1.35 var(--ac-font); color: var(--ac-text); }
.ac-timeline__value { flex: none; font: 600 var(--ac-fs-base) var(--ac-font); color: var(--ac-text); font-variant-numeric: tabular-nums; }
.ac-timeline__detail { margin: 0; font-size: var(--ac-fs-sm); line-height: 1.5; color: var(--ac-text-2); }
.is-next .ac-timeline__title, .is-next .ac-timeline__value { color: var(--ac-text-3); font-weight: 500; }
.is-failed .ac-timeline__detail { color: var(--ac-danger); }
@media (min-width: 641px) {
  .ac-timeline--h { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
  .ac-timeline--h .ac-timeline__item { grid-template-columns: minmax(0, 1fr); gap: 10px 0; padding: 0 16px 0 0; }
  .ac-timeline--h .ac-timeline__item::before { top: 15.5px; bottom: auto; left: 32px; right: 0; width: auto; height: 1px; }
}

/* ---------- Conversa ---------- */
.ac-chat { --ac-chat-h: 460px; display: grid; grid-template-rows: minmax(0, 1fr) auto; height: var(--ac-chat-h); min-width: 0; border: 1px solid var(--ac-border); border-radius: var(--ac-r-lg); background: var(--ac-surface); color: var(--ac-text); font-family: var(--ac-font); overflow: hidden; }
.ac-chat__view { position: relative; display: grid; min-height: 0; }
.ac-chat__log { display: flex; flex-direction: column; gap: 8px; min-height: 0; padding: 16px 14px 20px; overflow-y: auto; overscroll-behavior: contain; }
.ac-chat__log:focus-visible { outline: none; box-shadow: inset 0 0 0 3px var(--ac-ring); }
.ac-chat__day { align-self: center; margin: 4px 0; padding: 2px 10px; border-radius: var(--ac-r-full); background: var(--ac-surface-2); color: var(--ac-text-3); font-size: var(--ac-fs-xs); }
.ac-msg { --bg: var(--ac-surface-2); --fg: var(--ac-text); position: relative; display: flex; flex-direction: column; align-items: flex-start; align-self: flex-start; max-width: 80%; min-width: 0; }
.ac-msg--out { --bg: var(--ac-accent); --fg: var(--ac-on-accent); align-items: flex-end; align-self: flex-end; }
.ac-msg__bubble { position: relative; width: fit-content; max-width: 100%; padding: 8px 14px; border: 1px solid transparent; border-radius: 18px; background: var(--bg); color: var(--fg); font-size: var(--ac-fs-base); line-height: 1.45; overflow-wrap: anywhere; }
.ac-msg--in > .ac-msg__bubble { border-color: var(--ac-border); border-end-start-radius: 8px; }
.ac-msg--out > .ac-msg__bubble { border-end-end-radius: 8px; }
/* balões seguidos do mesmo lado ficam colados: o canto de dentro diminui */
.ac-msg--in + .ac-msg--in, .ac-msg--out + .ac-msg--out { margin-top: -5px; }
.ac-msg--in + .ac-msg--in > .ac-msg__bubble { border-start-start-radius: 8px; }
.ac-msg--out + .ac-msg--out > .ac-msg__bubble { border-start-end-radius: 8px; }
.ac-msg__bubble a { color: inherit; }
.ac-msg--soft { --bg: color-mix(in oklab, var(--ac-accent) 12%, var(--ac-surface)); --fg: var(--ac-text); }
.ac-msg--soft > .ac-msg__bubble { border: 1px dashed color-mix(in oklab, var(--ac-accent) 55%, transparent); }
.ac-msg--error { --bg: var(--ac-danger-bg); --fg: var(--ac-danger); }
.ac-msg__tag { margin: 0 6px 3px; color: var(--ac-text-3); font-size: var(--ac-fs-xs); font-weight: 500; }
.ac-msg__retry { min-height: 24px; margin-top: 2px; padding: 2px 6px; border: 0; border-radius: 6px; background: none; color: var(--ac-danger); font: 500 var(--ac-fs-sm) var(--ac-font); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.ac-msg__retry:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ac-ring); }
.ac-msg:has(> .ac-msg__time) > .ac-msg__bubble { cursor: pointer; }
.ac-msg__time { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--ac-dur-base) var(--ac-ease-out); }
.ac-msg__time > div { min-height: 0; overflow: hidden; }
.ac-msg__time time { display: block; padding: 3px 6px 0; color: var(--ac-text-3); font-size: var(--ac-fs-xs); }
.ac-msg[data-open] > .ac-msg__time { grid-template-rows: 1fr; }
.ac-msg__reaction { position: absolute; bottom: 0; z-index: 1; display: inline-flex; align-items: center; gap: 2px; padding: 0 6px; border-radius: var(--ac-r-full); background: var(--ac-surface); color: var(--ac-text); box-shadow: 0 0 0 2px var(--ac-surface), 0 0 0 3px var(--ac-border); font-size: var(--ac-fs-xs); line-height: 20px; transform: translateY(65%); }
.ac-msg--in .ac-msg__reaction { inset-inline-end: 10px; }
.ac-msg--out .ac-msg__reaction { inset-inline-start: 10px; }
.ac-msg:has(.ac-msg__reaction) { margin-bottom: 12px; }
.ac-chat__down { position: absolute; left: 50%; bottom: 12px; z-index: 2; display: grid; place-items: center; width: 36px; height: 36px; margin-left: -18px; padding: 0; border: 1px solid var(--ac-border); border-radius: 50%; background: var(--ac-surface); color: var(--ac-text); box-shadow: var(--ac-shadow); cursor: pointer; opacity: 0; visibility: hidden; transform: translateY(8px); transition: opacity var(--ac-dur-base), transform var(--ac-dur-base) var(--ac-ease-out), visibility 0s linear var(--ac-dur-base); }
.ac-chat__down.is-on { opacity: 1; visibility: visible; transform: none; transition: opacity var(--ac-dur-base), transform var(--ac-dur-base) var(--ac-ease-out), visibility 0s; }
.ac-chat__down:focus-visible { outline: none; box-shadow: var(--ac-shadow), 0 0 0 3px var(--ac-ring); }
.ac-chat__composer { display: flex; align-items: flex-end; gap: 6px; margin: 0 10px 10px; padding: 5px 5px 5px 14px; border: 1px solid var(--ac-border-strong); border-radius: 22px; background: var(--ac-surface); transition: border-color var(--ac-dur-fast), box-shadow var(--ac-dur-fast); }
.ac-chat__composer:focus-within { border-color: var(--ac-accent); box-shadow: 0 0 0 3px var(--ac-ring); }
.ac-chat__input { flex: 1; min-width: 0; height: 32px; max-height: 160px; margin: 0; padding: 6px 0; border: 0; background: none; color: var(--ac-text); font: var(--ac-fs-base)/20px var(--ac-font); resize: none; outline: none; overflow-y: auto; }
.ac-chat__input::placeholder { color: var(--ac-text-3); }
.ac-chat__composer .ac-btn { --h: 32px; flex: none; }

/* ---------- Campo copiável ---------- */
.ac-copyfield { --h: 40px; display: flex; align-items: stretch; width: 100%; min-width: 0; height: var(--h); border: 1px solid var(--ac-border-strong); border-radius: var(--ac-r-sm); background: var(--ac-surface-2); font-family: var(--ac-font); }
.ac-copyfield--sm { --h: 32px; }
.ac-copyfield--lg { --h: 48px; }
.ac-copyfield__value { flex: 1; min-width: 0; align-self: center; padding: 0 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ac-text); font: var(--ac-fs-base)/1.5 var(--ac-mono); user-select: all; }
.ac-copyfield--sm .ac-copyfield__value { padding: 0 10px; font-size: var(--ac-fs-sm); }
.ac-copyfield--lg .ac-copyfield__value { padding: 0 14px; font-size: var(--ac-fs-md); }
.ac-copyfield__btn { position: relative; display: grid; place-items: center; width: var(--h); flex: none; padding: 0; border: 0; border-left: 1px solid var(--ac-border-strong); border-radius: 0 calc(var(--ac-r-sm) - 1px) calc(var(--ac-r-sm) - 1px) 0; background: var(--ac-surface); color: var(--ac-text-2); cursor: pointer; transition: background var(--ac-dur-fast), color var(--ac-dur-fast); }
.ac-copyfield__btn:hover { background: var(--ac-surface-2); color: var(--ac-text); }
.ac-copyfield__btn:focus-visible { z-index: 1; outline: none; box-shadow: 0 0 0 3px var(--ac-ring); }
.ac-copyfield__icons { display: grid; }
.ac-copyfield__icons > .ac-icon { grid-area: 1 / 1; transition: transform var(--ac-dur-base) var(--ac-ease-out), opacity var(--ac-dur-base), filter var(--ac-dur-base); }
.ac-copyfield__icons > .ac-icon:last-child, .ac-copyfield[data-state="copied"] .ac-copyfield__icons > .ac-icon:first-child { opacity: 0; transform: scale(.5); filter: blur(4px); }
.ac-copyfield__icons > .ac-icon:last-child { color: var(--ac-success); }
.ac-copyfield[data-state="copied"] .ac-copyfield__icons > .ac-icon:last-child { opacity: 1; transform: none; filter: none; }
.ac-copyfield[data-state="manual"] { height: auto; min-height: var(--h); }
.ac-copyfield[data-state="manual"] .ac-copyfield__value { padding-block: 8px; white-space: normal; overflow-wrap: anywhere; }
.ac-copyfield__hint { margin: 0; color: var(--ac-text-2); font: var(--ac-fs-sm)/1.45 var(--ac-font); }
.ac-copyfield__hint[hidden] { display: none; }

/* ---------- Faixas de aviso em fila ---------- */
.ac-banners { --bn-bg: var(--ac-primary); --bn-fg: var(--ac-primary-text); position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 2px; min-height: 40px; padding: 4px 6px; overflow: hidden; background: var(--bn-bg); color: var(--bn-fg); font-family: var(--ac-font); isolation: isolate; }
.ac-banners[hidden] { display: none; }
/* listras finas a 45°, só na metade de baixo */
.ac-banners::before { content: ""; position: absolute; inset: 0; z-index: -1; background: repeating-linear-gradient(45deg, color-mix(in srgb, currentColor 9%, transparent) 0 10px, transparent 10px 20px); -webkit-mask-image: linear-gradient(transparent, #000 90%); mask-image: linear-gradient(transparent, #000 90%); pointer-events: none; }
/* crítico: o vermelho do perigo escurecido; fica escuro nos dois temas, por isso o texto é sempre branco */
.ac-banners[data-tone="critico"] { --bn-bg: color-mix(in oklab, var(--ac-danger) 76%, black); --bn-fg: #fff; }
.ac-banners[data-tone="perigo"] { --bn-bg: var(--ac-danger); --bn-fg: var(--ac-on-danger); }
.ac-banners[data-tone="atencao"] { --bn-bg: var(--ac-warning); --bn-fg: var(--ac-on-warning); }
.ac-banners[data-tone="ok"] { --bn-bg: var(--ac-success); --bn-fg: var(--ac-on-success); }
.ac-banners__item { display: flex; flex: 1; align-items: center; gap: 4px; min-width: 0; }
.ac-banners__item[hidden], .ac-banners__nav[hidden] { display: none; }
.ac-banners__body { display: flex; flex: 1; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 10px; min-width: 0; padding: 2px 4px; }
.ac-banners__icon { display: inline-grid; place-items: center; width: 24px; height: 24px; flex: none; border-radius: 6px; background: color-mix(in srgb, currentColor 20%, transparent); }
.ac-banners__icon .ac-icon { width: 16px; height: 16px; }
.ac-banners__text { flex: 0 1 auto; min-width: 0; margin: 0; font-size: var(--ac-fs-base); font-weight: 500; line-height: 1.35; text-align: center; }
.ac-banners__short { display: none; }
.ac-banners__action { display: inline-flex; align-items: center; flex: none; min-height: 24px; padding: 0 2px; border: 0; background: none; color: inherit; font: 600 var(--ac-fs-base) var(--ac-font); text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; cursor: pointer; }
.ac-banners__nav, .ac-banners__close { display: grid; place-items: center; width: 32px; height: 28px; flex: none; padding: 0; border: 0; border-radius: 6px; background: none; color: inherit; opacity: .85; cursor: pointer; }
.ac-banners__nav:hover, .ac-banners__close:hover { opacity: 1; background: color-mix(in srgb, currentColor 14%, transparent); }
/* sobre a cor forte da faixa, o anel de foco usa a cor do texto (o anel de destaque sumiria no azul ou no verde) */
.ac-banners :is(a, button):focus-visible { outline: 2px solid currentColor; outline-offset: 1px; border-radius: 4px; opacity: 1; }
@media (max-width: 640px) { .ac-banners__long { display: none; } .ac-banners__short { display: inline; } }

/* ---------- Escolha em cartões ---------- */
.ac-choice-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 10px; min-width: 0; margin: 0; padding: 0; border: 0; font-family: var(--ac-font); }
.ac-choice-cards > legend { padding: 0 0 8px; color: var(--ac-text); font: 500 var(--ac-fs-sm) var(--ac-font); }
.ac-choice-card { position: relative; display: flex; align-items: flex-start; gap: 10px; min-width: 0; padding: 14px 40px 14px 14px; border: 1px solid var(--ac-border-strong); border-radius: var(--ac-r); background: var(--ac-surface); color: var(--ac-text); cursor: pointer; transition: border-color var(--ac-dur-fast), background var(--ac-dur-fast), box-shadow var(--ac-dur-fast); }
.ac-choice-card:hover { border-color: var(--ac-text-3); }
/* o rádio nativo continua por cima do cartão, invisível: teclado (setas), leitor de tela e formulário funcionam como sempre */
.ac-choice-card > input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.ac-choice-card::after { content: ""; position: absolute; top: 13px; right: 13px; box-sizing: border-box; width: 18px; height: 18px; border: 1.5px solid var(--ac-border-strong); border-radius: 50%; background: var(--ac-surface); transition: background var(--ac-dur-fast), border-color var(--ac-dur-fast); }
.ac-choice-card::before { content: ""; position: absolute; top: 17px; right: 17px; z-index: 1; width: 10px; height: 10px; background: var(--ac-on-accent); clip-path: polygon(14% 52%, 0 66%, 38% 100%, 100% 22%, 86% 8%, 38% 72%); transform: scale(0); transition: transform .2s var(--ac-ease-spring); pointer-events: none; }
.ac-choice-card:has(> input:checked) { border-color: var(--ac-accent); background: color-mix(in oklab, var(--ac-accent) 7%, var(--ac-surface)); box-shadow: inset 0 0 0 1px var(--ac-accent); }
.ac-choice-card:has(> input:checked)::after { border-color: var(--ac-accent); background: var(--ac-accent); }
.ac-choice-card:has(> input:checked)::before { transform: scale(1); }
.ac-choice-card:has(> input:focus-visible) { box-shadow: 0 0 0 3px var(--ac-ring); }
.ac-choice-card:has(> input:checked:focus-visible) { box-shadow: inset 0 0 0 1px var(--ac-accent), 0 0 0 3px var(--ac-ring); }
.ac-choice-card:has(> input:disabled) { opacity: .55; cursor: not-allowed; }
.ac-choice-card:has(> input:disabled):hover { border-color: var(--ac-border-strong); }
.ac-choice-card > input:disabled { cursor: not-allowed; }
.ac-choice-card__icon { display: grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: 8px; background: var(--ac-surface-2); color: var(--ac-text-2); transition: background var(--ac-dur-fast), color var(--ac-dur-fast); }
.ac-choice-card:has(> input:checked) .ac-choice-card__icon { background: color-mix(in oklab, var(--ac-accent) 16%, var(--ac-surface)); color: var(--ac-accent); }
.ac-choice-card__text { display: grid; gap: 2px; min-width: 0; }
.ac-choice-card__title { font: 600 var(--ac-fs-base)/1.3 var(--ac-font); }
.ac-choice-card__desc { color: var(--ac-text-2); font-size: var(--ac-fs-sm); line-height: 1.4; }

/* ---------- Confirmar e alertar ---------- */
.ac-ask__error[hidden] { display: none; }
.ac-ask__error { margin: -4px 0 0; }

/* ---------- Diálogo vira bottom sheet no celular ----------
   Encaixa na borda de baixo, largura toda, só os cantos de cima arredondados. O próprio diálogo rola (sem arrastar a
   página) e as ações ficam presas embaixo. --ac-keyboard-h e --ac-visible-h vêm do JS quando o teclado virtual abre. */
@media (max-width: 640px) {
  .ac-dialog:not(.ac-command) { inset: auto 0 var(--ac-keyboard-h, 0px); width: 100%; max-width: none; max-height: calc(var(--ac-visible-h, 100dvh) - 24px); margin: 0; padding-bottom: max(6px, env(safe-area-inset-bottom)); border-width: 1px 0 0; border-radius: 16px 16px 0 0; overflow-y: auto; overscroll-behavior: contain; }
  .ac-dialog:not(.ac-command) .ac-dialog__in { padding: 20px 18px 0; }
  .ac-dialog:not(.ac-command) .ac-dialog__actions { position: sticky; bottom: 0; z-index: 1; flex-wrap: wrap; margin: 0 -18px; padding: 10px 18px 12px; background: var(--ac-surface); }
  .ac-dialog:not(.ac-command) .ac-dialog__actions > .ac-btn { flex: 1 1 auto; }
  .ac-dialog[open]:not(.ac-command) { animation: ac-sheet-in .4s cubic-bezier(.32, .72, 0, 1); }
  .ac-dialog.is-closing:not(.ac-command) { animation: ac-sheet-out .25s cubic-bezier(.32, .72, 0, 1) forwards; }
}

/* ======================= Carregamentos (pesquisa de 28/10/2026, 2ª rodada) ======================= */

/* ---------- Quatro pontos girando (PontosCarregando) e carregando na área ---------- */
.ac-orbit { --size: 48px; position: relative; flex: none; width: var(--size); height: var(--size); color: var(--ac-accent); animation: ac-orbit 2s linear infinite; }
.ac-orbit i { position: absolute; width: 40%; height: 40%; border-radius: 50%; background: currentColor; }
.ac-orbit i:nth-child(1) { top: 0; left: 0; }
.ac-orbit i:nth-child(2) { top: 0; right: 0; opacity: .75; }
.ac-orbit i:nth-child(3) { bottom: 0; right: 0; opacity: .5; }
.ac-orbit i:nth-child(4) { bottom: 0; left: 0; opacity: .3; }
.ac-orbit--inherit { color: inherit; }
.ac-loading-area { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 160px; padding: 24px; color: var(--ac-text); text-align: center; }
.ac-loading-area__text { font-size: var(--ac-fs-base); color: var(--ac-text-3); }

/* ---------- Espera longa (EsperaLonga): navegador desenhado, blocos pulsando e luz correndo pelos traços ---------- */
.ac-wait { --light-a: var(--ac-accent); --light-b: var(--ac-success); display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
.ac-wait__svg { display: block; width: 100%; max-width: 360px; height: auto; overflow: hidden; }
.ac-wait__grid { stroke: var(--ac-border); stroke-width: .5px; }
.ac-wait__frame { fill: var(--ac-surface); stroke: var(--ac-border-strong); stroke-width: 1px; filter: drop-shadow(0 4px 12px rgb(0 0 0 / .12)); }
:root[data-theme="dark"] .ac-wait__frame { filter: drop-shadow(0 0 10px rgb(0 0 0 / .9)); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ac-wait__frame { filter: drop-shadow(0 0 10px rgb(0 0 0 / .9)); } }
.ac-wait__bar { fill: var(--ac-surface-2); }
.ac-wait__dot { fill: var(--ac-border-strong); }
.ac-wait__label { font: 500 var(--ac-fs-xs) var(--ac-font); fill: var(--ac-text-2); }
.ac-wait__bone { fill: var(--ac-surface-3); animation: ac-wait-pulse 1.8s ease-in-out infinite; }
.ac-wait__bone:nth-of-type(2) { animation-delay: .15s; } .ac-wait__bone:nth-of-type(3) { animation-delay: .3s; } .ac-wait__bone:nth-of-type(4) { animation-delay: .45s; } .ac-wait__bone:nth-of-type(5) { animation-delay: .6s; } .ac-wait__bone:nth-of-type(6) { animation-delay: .75s; }
.ac-wait__trace { fill: none; stroke-width: 1.2px; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 120 600; stroke-dashoffset: 720; opacity: .95; filter: drop-shadow(0 0 4px var(--light-a)); animation: ac-wait-flow 5s linear infinite; }
.ac-wait__trace:nth-of-type(2) { animation-delay: -1.25s; } .ac-wait__trace:nth-of-type(3) { animation-delay: -2.5s; } .ac-wait__trace:nth-of-type(4) { animation-delay: -3.75s; }
.ac-wait__s1 { stop-color: var(--light-a); stop-opacity: 0; } .ac-wait__s2 { stop-color: var(--light-a); } .ac-wait__s3 { stop-color: var(--light-b); }
.ac-wait__note { margin: 0; font-size: var(--ac-fs-base); color: var(--ac-text-3); text-align: center; }

/* ---------- Sincronizando (Sincronizando): sonar com ícone, título e detalhe ---------- */
.ac-sync { display: flex; align-items: center; gap: 14px; min-height: 56px; }
.ac-sync__sonar { position: relative; display: grid; place-items: center; flex: none; width: 40px; height: 40px; border-radius: 50%; color: var(--ac-accent); background: color-mix(in oklab, var(--ac-accent) 16%, transparent); }
.ac-sync__sonar > .ac-icon { position: relative; width: 18px; height: 18px; }
.ac-sync__sonar > i { position: absolute; inset: 0; border: 1.5px solid currentColor; border-radius: 50%; opacity: 0; animation: ac-sync-wave 2.4s cubic-bezier(.2, .6, .3, 1) infinite; }
.ac-sync__sonar > i:nth-child(2) { animation-delay: .8s; } .ac-sync__sonar > i:nth-child(3) { animation-delay: 1.6s; }
.ac-sync > .ac-orbit { --size: 30px; margin: 0 5px; }
.ac-sync__text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ac-sync__title { font-size: var(--ac-fs-base); font-weight: 600; color: var(--ac-text); }
.ac-sync__detail { font-size: var(--ac-fs-base); line-height: 1.45; color: var(--ac-text-3); }

/* movimento reduzido: cada efeito tem um estado parado que ainda comunica (a regra global só encurtaria a animação) */
@media (prefers-reduced-motion: reduce) {
  .ac-orbit, .ac-wait__bone { animation: none; }
  .ac-wait__trace { stroke-dasharray: none; opacity: .45; animation: none; }
  .ac-sync__sonar > i { opacity: .2; transform: scale(1.3); animation: none; }
  .ac-sync__sonar > i + i { display: none; }
}

/* ======================= Imagens: galeria, lightbox, carrossel com miniaturas e coverflow ======================= */

/* ---------- Galeria em grade (e mosaico) ---------- */
.ac-gallery { --min: 160px; --gap: 8px; --ratio: 4 / 3; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(var(--min), 100%), 1fr)); gap: var(--gap); margin: 0; padding: 0; list-style: none; }
.ac-gallery__item { position: relative; display: block; overflow: hidden; aspect-ratio: var(--ratio); margin: 0; padding: 0; border: 0; border-radius: var(--ac-r); background: var(--ac-surface-2); color: #fff; cursor: zoom-in; -webkit-tap-highlight-color: transparent; }
.ac-gallery__item img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .6s var(--ac-ease), filter .3s var(--ac-ease); }
.ac-gallery__item:hover img { transform: scale(1.05); }
.ac-gallery__item:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ac-ring); }
.ac-gallery__cap { position: absolute; inset: auto 0 0; padding: 28px 12px 10px; background: linear-gradient(transparent, rgb(0 0 0 / .62)); font: 500 var(--ac-fs-base)/1.3 var(--ac-font); text-align: left; opacity: 0; translate: 0 6px; transition: opacity .25s var(--ac-ease), translate .25s var(--ac-ease); pointer-events: none; }
.ac-gallery__item:hover .ac-gallery__cap, .ac-gallery__item:focus-visible .ac-gallery__cap { opacity: 1; translate: 0 0; }
@media (hover: none) { .ac-gallery__cap { opacity: 1; translate: 0 0; } }
/* destaque: a primeira imagem ocupa 2×2 */
.ac-gallery--featured .ac-gallery__item:first-child { grid-column: span 2; grid-row: span 2; aspect-ratio: auto; }
/* mosaico: colunas com alturas livres (a ordem de leitura desce coluna a coluna) */
.ac-gallery--masonry { display: block; columns: var(--min) var(--cols, 4); column-gap: var(--gap); }
.ac-gallery--masonry .ac-gallery__item { aspect-ratio: auto; margin-bottom: var(--gap); break-inside: avoid; }
.ac-gallery--masonry .ac-gallery__item img { height: auto; }

/* ---------- Lightbox: imagem em tela cheia ---------- */
.ac-lightbox { position: fixed; inset: 0; width: 100vw; max-width: none; height: 100vh; height: 100dvh; max-height: none; margin: 0; padding: 0; border: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: rgb(8 8 10 / .94); color: #fff; font-family: var(--ac-font); color-scheme: dark; }
.ac-lightbox:not([open]) { display: none; }
.ac-lightbox[open] { animation: ac-fade .25s var(--ac-ease); }
.ac-lightbox.is-closing { animation: ac-lb-out .2s var(--ac-ease) forwards; }
.ac-lightbox::backdrop { background: transparent; }
.ac-lightbox__top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 12px 8px 20px; }
.ac-lightbox__count { font: 500 var(--ac-fs-base) var(--ac-font); font-variant-numeric: tabular-nums; color: rgb(255 255 255 / .75); }
.ac-lightbox__btn { display: grid; place-items: center; width: 44px; height: 44px; flex: none; padding: 0; border: 0; border-radius: 50%; background: rgb(255 255 255 / .1); color: #fff; cursor: pointer; transition: background var(--ac-dur-fast); }
.ac-lightbox__btn:hover { background: rgb(255 255 255 / .2); }
.ac-lightbox__btn:focus-visible, .ac-lightbox__thumb:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.ac-lightbox__stage { position: relative; display: grid; place-items: center; min-height: 0; padding: 0 72px; touch-action: pan-y; }
.ac-lightbox__stage > .ac-lightbox__btn { position: absolute; top: 50%; translate: 0 -50%; z-index: 1; }
.ac-lightbox__stage > [data-lb="-1"] { left: 16px; } .ac-lightbox__stage > [data-lb="1"] { right: 16px; }
.ac-lightbox__figure { display: grid; justify-items: center; align-content: center; gap: 12px; height: 100%; min-height: 0; margin: 0; }
.ac-lightbox__img { display: block; max-width: 100%; max-height: calc(100dvh - 210px); object-fit: contain; border-radius: 10px; user-select: none; -webkit-user-drag: none; }
.ac-lightbox__img.is-in { animation: ac-lb-in .35s var(--ac-ease); }
.ac-lightbox__cap { max-width: 64ch; font-size: var(--ac-fs-base); line-height: 1.5; color: rgb(255 255 255 / .82); text-align: center; }
.ac-lightbox__thumbs { display: flex; justify-content: safe center; gap: 6px; padding: 10px 16px 16px; overflow-x: auto; scrollbar-width: none; }
.ac-lightbox__thumbs::-webkit-scrollbar { display: none; }
.ac-lightbox__thumb { flex: none; width: 64px; height: 44px; padding: 0; border: 2px solid transparent; border-radius: 8px; overflow: hidden; background: none; opacity: .5; cursor: pointer; transition: opacity var(--ac-dur-fast), border-color var(--ac-dur-fast); }
.ac-lightbox__thumb:hover { opacity: .85; }
.ac-lightbox__thumb[aria-current="true"] { opacity: 1; border-color: #fff; }
.ac-lightbox__thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
@media (max-width: 640px) {
  .ac-lightbox__stage { padding: 0 8px; }
  .ac-lightbox__stage > .ac-lightbox__btn { top: auto; bottom: 8px; translate: none; width: 40px; height: 40px; background: rgb(0 0 0 / .45); }
}

/* ---------- Carrossel de imagens: slide com foto e miniaturas no lugar das bolinhas ---------- */
.ac-carousel__media { position: relative; margin: 0; overflow: hidden; border-radius: var(--ac-r-lg); background: var(--ac-surface-2); color: #fff; }
.ac-carousel__media img { display: block; width: 100%; aspect-ratio: var(--ratio, 16 / 9); object-fit: cover; }
.ac-carousel__media figcaption { position: absolute; inset: auto 0 0; padding: 40px 18px 14px; background: linear-gradient(transparent, rgb(0 0 0 / .6)); font: 500 var(--ac-fs-md)/1.35 var(--ac-font); }
.ac-carousel[data-lightbox] .ac-carousel__media img { cursor: zoom-in; }
.ac-carousel[data-thumbs] .ac-carousel__dots { display: none; }
.ac-carousel__thumbs { display: flex; gap: 8px; overflow-x: auto; padding: 3px; scrollbar-width: none; }
.ac-carousel__thumbs::-webkit-scrollbar { display: none; }
.ac-carousel__thumb { flex: 0 0 auto; width: 76px; aspect-ratio: 4 / 3; padding: 0; border: 0; border-radius: 8px; overflow: hidden; background: var(--ac-surface-2); opacity: .55; cursor: pointer; box-shadow: 0 0 0 0 transparent; transition: opacity var(--ac-dur-fast), box-shadow var(--ac-dur-fast); }
.ac-carousel__thumb:hover { opacity: .85; }
.ac-carousel__thumb[aria-current="true"] { opacity: 1; box-shadow: 0 0 0 2px var(--ac-text); }
.ac-carousel__thumb:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ac-ring); }
.ac-carousel__thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }

/* ---------- Coverflow: carrossel 3D, a imagem do meio de frente e as outras giradas para os lados ---------- */
.ac-coverflow { --w: 230px; --ratio: 3 / 4; display: grid; gap: 14px; min-width: 0; font-family: var(--ac-font); }
.ac-coverflow__stage { position: relative; height: calc(var(--w) * 4 / 3 + 48px); overflow: hidden; perspective: 1100px; touch-action: pan-y; outline: none; border-radius: var(--ac-r-lg); }
.ac-coverflow__stage:focus-visible { box-shadow: 0 0 0 3px var(--ac-ring); }
.ac-coverflow__item { position: absolute; top: 12px; left: 50%; width: var(--w); margin: 0 0 0 calc(var(--w) / -2); transform-style: preserve-3d; transition: transform .55s var(--ac-ease), opacity .4s var(--ac-ease), filter .4s var(--ac-ease); cursor: pointer; }
.ac-coverflow__item img { display: block; width: 100%; aspect-ratio: var(--ratio); object-fit: cover; border-radius: 14px; box-shadow: 0 18px 40px rgb(0 0 0 / .28); -webkit-box-reflect: below 4px linear-gradient(transparent 78%, rgb(0 0 0 / .22)); user-select: none; -webkit-user-drag: none; }
.ac-coverflow__item figcaption { margin-top: 10px; font: 500 var(--ac-fs-base)/1.35 var(--ac-font); color: var(--ac-text); text-align: center; opacity: 0; transition: opacity .3s var(--ac-ease); }
.ac-coverflow__item.is-active { cursor: default; }
.ac-coverflow__item.is-active figcaption { opacity: 1; }
.ac-coverflow[data-lightbox] .ac-coverflow__item.is-active { cursor: zoom-in; }
.ac-carousel__btn[aria-disabled="true"] { opacity: .35; cursor: default; }
.ac-coverflow__status { min-width: 64px; padding: 0 6px; font: 500 var(--ac-fs-base) var(--ac-font); font-variant-numeric: tabular-nums; color: var(--ac-text-2); text-align: center; }
@media (max-width: 640px) { .ac-coverflow { --w: 160px; } }
@media (prefers-reduced-motion: reduce) { .ac-coverflow__item, .ac-gallery__item img { transition: none; } .ac-gallery__item:hover img { transform: none; } }

/* ---------- Banner com fotos (hero): foto em tela cheia trocando com fade e zoom lento, progresso em barrinhas ---------- */
.ac-hero { --t: 6000ms; --accent: #2dd4bf; --pad: clamp(20px, 4vw, 42px); position: relative; isolation: isolate; overflow: hidden; min-height: var(--h, 560px); border-radius: var(--ac-r-lg); background: #0b0b0c; color: #fff; font-family: var(--ac-font); color-scheme: dark; }
.ac-hero__brand { position: absolute; top: var(--pad); left: var(--pad); z-index: 2; display: flex; align-items: center; gap: 10px; font: 700 var(--ac-fs-xl) var(--ac-font); letter-spacing: -.02em; color: #fff; text-decoration: none; }
.ac-hero__slide { position: absolute; inset: 0; z-index: 0; display: flex; flex-direction: column; justify-content: flex-end; margin: 0; padding: var(--pad) var(--pad) calc(var(--pad) + 52px); opacity: 0; transition: opacity .9s var(--ac-ease); }
.ac-hero__slide.is-active { z-index: 1; opacity: 1; }
.ac-hero__slide > img { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; object-fit: cover; transform: scale(1.08); transition: transform calc(var(--t) + 900ms) linear; }
.ac-hero__slide.is-active > img { transform: scale(1); }
/* sombra embaixo (texto) e em cima (logo): o texto branco fica legível sobre qualquer foto */
.ac-hero__slide::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to top, rgb(0 0 0 / .82) 0%, rgb(0 0 0 / .35) 38%, transparent 62%), linear-gradient(to bottom, rgb(0 0 0 / .45), transparent 22%); }
.ac-hero__text { display: grid; gap: 12px; max-width: 34rem; transform: translateY(14px); opacity: 0; transition: transform .7s var(--ac-ease) .25s, opacity .7s var(--ac-ease) .25s; }
.ac-hero__slide.is-active .ac-hero__text { transform: none; opacity: 1; }
.ac-hero__title { margin: 0; font: 700 clamp(28px, 4.2vw, 46px)/1.08 var(--ac-font); letter-spacing: -.03em; text-wrap: balance; }
.ac-hero__title em { font-style: normal; color: var(--accent); }
.ac-hero__sub { margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: var(--ac-fs-md); line-height: 1.45; color: rgb(255 255 255 / .86); }
.ac-hero__tag { font: 700 var(--ac-fs-sm) var(--ac-font); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.ac-hero__bar { position: absolute; left: var(--pad); bottom: var(--pad); z-index: 2; display: flex; align-items: center; gap: 4px; }
.ac-hero__seg { display: grid; align-items: center; width: 34px; height: 24px; padding: 0; border: 0; background: none; cursor: pointer; }
.ac-hero__seg > span { display: block; height: 3px; border-radius: 3px; background: rgb(255 255 255 / .32); overflow: hidden; }
.ac-hero__seg > span::after { content: ""; display: block; height: 100%; background: #fff; transform: scaleX(0); transform-origin: left; }
.ac-hero__seg.is-done > span::after { transform: none; }
.ac-hero__seg.is-on > span::after { animation: ac-hero-fill var(--t) linear forwards; }
.ac-hero[data-paused="true"] .ac-hero__seg.is-on > span::after { animation-play-state: paused; }
.ac-hero__seg[aria-current="true"] { width: 48px; }
.ac-hero__seg:focus-visible, .ac-hero__pause:focus-visible { outline: 2px solid #fff; outline-offset: 2px; border-radius: 6px; }

  .ac-shell__in { grid-template-columns: minmax(0, 1fr); min-height: 0; }

.ac-auth__panel::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to top, rgb(0 0 0 / .78), rgb(0 0 0 / .1) 55%, rgb(0 0 0 / .35)); }

/* ---------- Checkout (padrão Baymard): poucos campos, resumo do total sempre à vista ---------- */
.ac-checkout { container: ac-checkout / inline-size; background: var(--ac-bg); color: var(--ac-text); font-family: var(--ac-font); }
.ac-checkout__in { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; align-items: start; padding: 24px; }
.ac-checkout__form { display: grid; gap: 22px; min-width: 0; }

/* ======================= Mais efeitos 3D (pesquisa de 29/10/2026: Aceternity e Magic UI, reimplementados em CSS 3D) ======================= */

/* ---------- Cartão que vira: frente e verso ---------- */

  /* Tour de apresentação: destaca um elemento por vez com um recorte de luz, um balão

      else { Object.assign(spot.style, { left: vw / 2 + 'px', top: vh / 2 + 'px', width: '0px', height: '0px' }); spot.classList.add('is-center'); }
      const tw = tip.offsetWidth, th = tip.offsetHeight, gap = 14; let left, top, pos = t ? (s.position || 'bottom') : 'center';

        if (pos === 'bottom') { top = r.bottom + gap; left = r.left + r.width / 2 - tw / 2; } else if (pos === 'top') { top = r.top - gap - th; left = r.left + r.width / 2 - tw / 2; }

  /* Banner com fotos: cada .ac-hero__slide tem a foto e o texto; troca sozinho a cada
