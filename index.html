<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Orthos UI — biblioteca de componentes</title>
<meta name="description" content="Biblioteca de componentes em HTML, CSS e JavaScript, sem dependências.">
<script>
  (function () { try { var t = localStorage.getItem('orthos.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (_) {} })();
</script>
<link rel="icon" href="brand/orthos-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="src/orthos.css">
<link rel="stylesheet" href="site/site.css">
</head>
<body class="ac">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="orthos-mark" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0b0b0c"/><rect x="15.25" y="15.25" width="13.5" height="13.5" rx="2.25" fill="none" stroke="#fafafa" stroke-width="2.5"/><rect x="34" y="14" width="16" height="16" rx="3.5" fill="#fafafa"/><rect x="15.25" y="35.25" width="13.5" height="13.5" rx="2.25" fill="none" stroke="#fafafa" stroke-width="2.5"/><rect x="35.25" y="35.25" width="13.5" height="13.5" rx="2.25" fill="none" stroke="#fafafa" stroke-width="2.5"/></symbol></svg>
<a class="skip" href="#main">Pular para o conteúdo</a>

<div class="shell">
  <aside class="side" id="side" aria-label="Componentes">
    <div class="side__top">
      <a class="brand" href="#/" aria-label="Orthos UI, início"><svg class="brand__mark" aria-hidden="true"><use href="#orthos-mark"/></svg><span>Orthos</span><span class="brand__tag">UI</span></a>
      <button class="ac-btn ac-btn--ghost ac-btn--icon ac-btn--sm only-m" type="button" id="side-close" aria-label="Fechar menu"><svg class="ac-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6.00081 17.9992M17.9992 18L6 6.00085"/></svg></button>
    </div>
    <button class="search" type="button" id="open-cmd"><svg class="ac-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 17L21 21"/><path d="M19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19C15.4183 19 19 15.4183 19 11Z"/></svg><span>Buscar</span><kbd class="ac-kbd">Ctrl K</kbd></button>
    <nav id="nav"></nav>
    <div class="side__foot">
      <button class="ac-btn ac-btn--ghost ac-btn--sm" type="button" id="theme" aria-label="Alternar tema"><svg class="ac-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.5 14.0784C20.3003 14.7189 18.9301 15.0821 17.4751 15.0821C12.7491 15.0821 8.91792 11.2509 8.91792 6.52485C8.91792 5.06986 9.28105 3.69968 9.92163 2.5C5.66765 3.49698 2.5 7.31513 2.5 11.8731C2.5 17.1899 6.8101 21.5 12.1269 21.5C16.6849 21.5 20.503 18.3324 21.5 14.0784Z"/></svg><span id="theme-l">Tema escuro</span></button>
    </div>
  </aside>
  <div class="veil" id="veil" hidden></div>

  <div class="top-m only-m">
    <button class="ac-btn ac-btn--ghost ac-btn--icon" type="button" id="side-open" aria-label="Abrir menu" aria-controls="side" aria-expanded="false"><svg class="ac-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5L20 5"/><path d="M4 12L20 12"/><path d="M4 19L20 19"/></svg></button>
    <a class="brand" href="#/"><svg class="brand__mark" aria-hidden="true"><use href="#orthos-mark"/></svg><span>Orthos</span></a>
    <button class="ac-btn ac-btn--ghost ac-btn--icon" type="button" id="open-cmd-m" aria-label="Buscar"><svg class="ac-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 17L21 21"/><path d="M19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19C15.4183 19 19 15.4183 19 11Z"/></svg></button>
  </div>

  <main class="main" id="main" tabindex="-1"></main>
</div>

<script src="src/orthos.js"></script>
<script src="site/demos.js"></script>
<script src="site/demos-novos.js"></script>
<script src="site/guia.js"></script>
<script src="site/site.js"></script>
</body>
</html>
