<!doctype html>
<html lang="pt-BR" data-tema="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="darkreader-lock">
<title>Biblioteca de referências UI/UX</title>
<script>
  // aplica o tema guardado antes de pintar
  (function () { try { var t = localStorage.getItem('uilib.tema'); if (t === 'claro' || t === 'escuro') document.documentElement.setAttribute('data-tema', t); } catch (_) {} })();
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>

<div class="app" id="app">
  <header class="topo">
    <button class="btn btn--icone only-mobile" id="btn-menu" type="button" aria-controls="nav" aria-expanded="false" aria-label="Abrir menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a class="marca" href="#/" aria-label="Biblioteca de referências UI/UX, início">
      <span class="marca__logo" aria-hidden="true"></span>
      <span class="marca__nome">Referências UI/UX</span>
    </a>
    <form class="busca" id="form-busca" role="search" autocomplete="off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <label class="sr" for="q">Buscar na biblioteca</label>
      <input id="q" type="search" placeholder="Buscar: “tabela com filtros”, “erro de formulário”, “modal de confirmação”" spellcheck="false">
      <kbd aria-hidden="true">/</kbd>
    </form>
    <div class="topo__acoes">
      <button class="btn btn--sec" id="btn-add" type="button">Adicionar</button>
      <button class="btn btn--icone" id="btn-tema" type="button" aria-label="Alternar tema" title="Alternar tema">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      </button>
    </div>
  </header>

  <div class="corpo">
    <div class="veu" id="veu" hidden></div>
    <nav class="nav" id="nav" aria-label="Biblioteca"></nav>
    <main id="conteudo" class="main" tabindex="-1"></main>
  </div>
</div>

<div class="sr" id="anuncio" role="status" aria-live="polite"></div>

<dialog id="dlg-add" class="dlg" aria-labelledby="dlg-add-t"></dialog>
<dialog id="dlg-img" class="dlg dlg--img" aria-label="Imagem ampliada"></dialog>

<noscript><p style="padding:24px">Esta biblioteca precisa de JavaScript.</p></noscript>

<script src="data/meta.js"></script>
<script src="data/refs.js"></script>
<script src="data/local-4squad.js"></script>
<script src="js/app.js"></script>
</body>
</html>
