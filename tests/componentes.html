<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testes — Orthos UI</title>
<link rel="icon" href="../brand/orthos-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="../src/orthos.css">
<style>
  body { margin: 0; padding: 24px; background: var(--ac-bg); color: var(--ac-text); font: 14px/1.5 var(--ac-font); }
  h1 { margin: 0 0 4px; font-size: 22px; } #resumo { margin: 0 0 16px; color: var(--ac-text-2); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; } td, th { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--ac-border); vertical-align: top; }
  .ok { color: var(--ac-success); font-weight: 600; } .falha { color: var(--ac-danger); font-weight: 600; }
  #palco { position: absolute; left: -10000px; top: 0; width: 900px; }
</style>
</head>
<body class="ac">
<h1>Testes dos componentes</h1>
<p id="resumo" role="status">Rodando…</p>
<table><thead><tr><th>Teste</th><th>Resultado</th><th>Detalhe</th></tr></thead><tbody id="saida"></tbody></table>
<div id="palco"></div>

<script src="../src/orthos.js"></script>
<script>window.DEMO_HOOKS = {};</script>
<script src="../site/demos.js"></script>
<script src="../site/demos-novos.js"></script>
<script src="../site/demos-referencias.js"></script>
<script src="../site/guia.js"></script>
<script>
/* Abra no navegador (python -m http.server na raiz e /tests/componentes.html). O resultado também fica em window.RESULTADO. */
(async () => {
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const w = ms => new Promise(r => setTimeout(r, ms));
  const key = (el, k, o = {}) => el.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, ...o }));
  const erros = []; window.addEventListener('error', e => erros.push(e.message)); const ce = console.error; console.error = (...a) => { erros.push(a.join(' ')); ce(...a); };
  const res = [], palco = $('#palco');
  const t = async (nome, fn) => { const e0 = erros.length; try { const d = await fn(); if (erros.length > e0) throw new Error(erros.slice(e0).join('; ')); res.push([nome, true, d || '']); } catch (e) { res.push([nome, false, e.message]); } };
  const ok = (c, m) => { if (!c) throw new Error(m); };
  const mount = id => { document.querySelectorAll('body > .ac-pop, body > .ac-tip').forEach(n => n.remove()); const d = DEMOS.find(x => x.id === id); palco.innerHTML = d.html; Orthos.init(palco); (DEMO_HOOKS[id] || (() => {}))(palco); return palco; };

  // 1. todo componente monta sem erro e tem documentação completa
  for (const d of DEMOS) await t(`monta: ${d.id}`, async () => { mount(d.id); await w(30); ok(palco.children.length, 'demo vazia'); ok(d.api && d.api.length, 'sem API'); ok(d.a11y && d.a11y.length, 'sem notas de acessibilidade'); ok(GUIA[d.id] && GUIA[d.id].usar && GUIA[d.id].evitar && GUIA[d.id].dicas, 'sem guia de uso'); });

  // 2. comportamentos
  await t('toast: região viva existe antes do 1º aviso', () => { const h = $('.ac-toaster'); ok(h && h.getAttribute('aria-live') === 'polite', 'região ausente'); });
  await t('toast: Alt+T foca o aviso e Esc dispensa', async () => { Orthos.toast('Teste'); await w(20); key(document, 't', { altKey: true }); ok(document.activeElement.classList.contains('ac-toast'), 'foco não foi'); key(document.activeElement, 'Escape'); await w(300); ok(!$$('.ac-toast').some(x => x.textContent.includes('Teste')), 'não dispensou'); });
  await t('toast.promise: carregando → sucesso', async () => { Orthos.toast.promise(new Promise(r => setTimeout(() => r(2), 80)), { loading: 'Enviando', success: n => `${n} enviados` }); await w(20); ok($$('.ac-toast').some(x => x.getAttribute('aria-busy') === 'true'), 'sem carregando'); await w(120); ok($$('.ac-toast').some(x => x.textContent.includes('2 enviados')), 'sem sucesso'); });
  await t('select: teclado escolhe e sincroniza o <select>', async () => { mount('select'); const b = $('.ac-select__trigger', palco), s = $('select', palco); key(b, 'ArrowDown'); await w(20); const lb = $('body > .ac-pop .ac-listbox'); ok(lb && document.activeElement === lb, 'lista não abriu'); key(lb, 'ArrowDown'); key(lb, 'Enter'); await w(20); ok(s.value === 'sp', 'valor ' + s.value); ok(b.textContent.includes('Brasília'), 'rótulo'); });
  await t('select: opção desabilitada é pulada', async () => { mount('select'); const b = $('.ac-select__trigger', palco), s = $('select', palco); s.value = 'mad'; s.dispatchEvent(new Event('change')); key(b, 'Enter'); await w(20); const lb = $('body > .ac-pop .ac-listbox'); key(lb, 'ArrowDown'); key(lb, 'Enter'); await w(20); ok(s.value === 'mad', 'escolheu desabilitada: ' + s.value); });
  await t('popover: abre, foca o campo e fecha com Esc', async () => { mount('popover'); const b = $('[data-ac="popover"]', palco); b.click(); await w(20); ok(document.activeElement.id === 'pd-w', 'foco ' + document.activeElement.id); key(document, 'Escape'); await w(20); ok($('#pop-dim').hidden && document.activeElement === b, 'não fechou'); });
  await t('context menu: Shift+F10 abre; setas e Home/End', async () => { mount('contextmenu'); const a = $('[data-ac="contextmenu"]', palco); a.focus(); key(a, 'F10', { shiftKey: true }); await w(20); const m = $('#ctx-demo'); ok(!m.hidden, 'não abriu'); key(document.activeElement, 'End'); ok(document.activeElement.textContent.includes('Excluir'), 'End'); key(document, 'Escape'); });
  await t('menubar: → troca de menu aberto', async () => { mount('contextmenu'); const tr = $$('.ac-menubar__trigger', palco); key(tr[0], 'ArrowDown'); await w(20); ok(!$('#mb-arq').hidden, 'Arquivo fechado'); key(document.activeElement, 'ArrowRight'); await w(20); ok(!$('#mb-edit').hidden && $('#mb-arq').hidden, 'não trocou'); key(document, 'Escape'); });
  await t('toolbar: setas movem o foco (um só Tab)', async () => { mount('toggle'); const it = $$('.ac-toolbar button', palco); ok(it.filter(x => x.tabIndex === 0).length === 1, 'mais de um Tab'); it[0].focus(); key(it[0], 'ArrowRight'); ok(document.activeElement === it[1], 'não andou'); });
  await t('toggle: alterna aria-pressed', () => { mount('toggle'); const b = $('[data-ac="toggle"]', palco); b.click(); ok(b.getAttribute('aria-pressed') === 'true', 'não ligou'); });
  await t('number field: setas, limites e formato', async () => { mount('number'); const i = $('input', palco); key(i, 'ArrowUp'); ok(i.getAttribute('aria-valuenow') === '6', 'subiu? ' + i.getAttribute('aria-valuenow')); key(i, 'End'); ok(i.getAttribute('aria-valuenow') === '50', 'End'); key(i, 'ArrowUp'); ok(i.getAttribute('aria-valuenow') === '50', 'passou do máximo'); const p = $$('input', palco)[1]; key(p, 'ArrowUp'); ok(p.value.startsWith('50,40'), 'formato ' + p.value); });
  await t('pessoas: Enter marca; Backspace remove', async () => { mount('people'); const el = $('[data-ac="people"]', palco), i = $('input', el); ok($$('.ac-chip', el).length === 2, 'iniciais'); i.focus(); i.value = 'elisa'; i.dispatchEvent(new Event('input')); await w(20); key(i, 'Enter'); ok($$('.ac-chip', el).length === 3, 'não marcou'); i.value = ''; key(i, 'Backspace'); ok($$('.ac-chip', el).length === 2, 'não removeu'); });
  await t('tags: Enter cria, duplicada é recusada', async () => { mount('people'); const el = $('[data-ac="tags"]', palco), i = $('input', el); i.value = 'Nova'; key(i, 'Enter'); i.value = 'nova'; key(i, 'Enter'); ok($$('.ac-chip', el).length === 3, 'contagem ' + $$('.ac-chip', el).length); });
  await t('intervalo: atalho “Últimos 7 dias”', async () => { mount('daterange'); const b = $('[data-ac="daterange"]', palco); let got; b.addEventListener('ac:change', e => got = e.detail); b.click(); await w(20); $$('body > .ac-range [data-p]')[2].click(); await w(20); ok(got && Math.round((got.ate - got.de) / 864e5) === 6, 'intervalo errado'); ok(/ a /.test(b.textContent), 'rótulo ' + b.textContent); });
  await t('intervalo: dois cliques escolhem início e fim', async () => { mount('daterange'); const b = $('[data-ac="daterange"]', palco); let got; b.addEventListener('ac:change', e => got = e.detail); b.click(); await w(20); let days = $$('body > .ac-range .ac-cal__day'); days[3].click(); await w(20); days = $$('body > .ac-range .ac-cal__day'); days[9].click(); await w(250); ok(got && Math.round((got.ate - got.de) / 864e5) === 6, 'intervalo ' + JSON.stringify(got)); });
  await t('resultado: troca de código (403)', async () => { mount('result'); $$('#res-codes button', palco)[1].click(); await w(30); ok($('#res-demo .ac-result__title', palco).textContent.includes('acesso'), 'não trocou'); });
  await t('gráfico de área: setas leem pontos e “Ver tabela”', async () => { mount('charts'); const p = $('.ac-area__plot', palco); p.focus(); key(p, 'Home'); ok($('.ac-area__tip', palco).textContent.includes('14/10'), 'dica'); const b = $('.ac-area__foot button', palco); b.click(); ok(b.getAttribute('aria-expanded') === 'true' && $$('.ac-area tbody tr', palco).length === 14, 'tabela'); });
  await t('cartão recolhível: aria-expanded', () => { mount('collapsible'); const b = $('[data-ac-trigger]', palco); b.click(); ok(b.getAttribute('aria-expanded') === 'true', 'não abriu'); });
  await t('menu antigo: Home/End após troca para menuKeys', async () => { mount('menu'); const b = $('[data-ac="menu"]', palco); key(b, 'ArrowDown'); await w(20); key(document.activeElement, 'End'); ok(document.activeElement.textContent.includes('Excluir'), 'End'); key(document, 'Escape'); });
  await t('logo: padrão desenha 4 traços e recarrega', async () => { mount('logo-loader'); await w(80); const el = $('#ll-demo', palco); ok($$('.ac-logo-load__trace', el).length === 4, 'traços ' + $$('.ac-logo-load__trace', el).length); Orthos.logo.replay(el); ok(el.getAnimations({ subtree: true }).length > 0, 'sem animação'); });
  await t('logo: SVG com script é limpo antes de desenhar', async () => { const el = document.createElement('div'); palco.appendChild(el); await Orthos.logo.load(el, '<svg viewBox="0 0 10 10"><script>alert(1)<\/script><g transform="scale(2)"><circle cx="5" cy="5" r="4" fill="red" onclick="alert(1)"/></g><image href="x.png"/></svg>'); ok(!el.querySelector('script, image, [onclick]'), 'sobrou conteúdo perigoso'); ok($$('.ac-logo-load__fill circle', el).length === 1, 'círculo não desenhado'); });
  await t('logo: SVG sem formas dá erro claro', async () => { let m = ''; try { Orthos.logo.sanitize('<svg><text>oi</text></svg>'); } catch (e) { m = e.message; } ok(/formas/.test(m), 'mensagem: ' + m); });
  await t('logo: imagem é ajustada a 240 × 240', async () => { const c = document.createElement('canvas'); c.width = 400; c.height = 100; c.getContext('2d').fillRect(0, 0, 400, 100); const el = document.createElement('div'); palco.appendChild(el); await Orthos.logo.load(el, c.toDataURL()); const im = $('.ac-logo-load__img img', el); await new Promise(r => im.complete ? r() : im.onload = r); ok(im.naturalWidth === 240 && im.naturalHeight === 240, im.naturalWidth + 'x' + im.naturalHeight); });
  await t('tela de carregamento: aparece, anuncia e some', async () => { const hide = Orthos.loading({ delay: 10, min: 50, text: 'Abrindo' }); await w(60); const ov = $('.ac-loading-screen'); ok(ov && ov.dataset.on === 'true' && ov.textContent.includes('Abrindo'), 'não apareceu'); hide(); await w(400); ok(!$('.ac-loading-screen'), 'não sumiu'); });
  await t('alterações não salvas: barra aparece, some ao voltar e ao descartar', async () => { mount('dirty'); const f = $('#dirty-demo', palco), i = $('#dd-nome', f), bar = $('.ac-savebar', f); i.value = 'Outro'; i.dispatchEvent(new Event('input', { bubbles: true })); await w(40); ok(bar.classList.contains('is-on'), 'não apareceu'); i.value = 'Estúdio Norte'; i.dispatchEvent(new Event('input', { bubbles: true })); await w(40); ok(!bar.classList.contains('is-on'), 'não sumiu ao voltar'); $('[name=vitrine]', f).click(); await w(40); ok(bar.classList.contains('is-on'), 'switch não contou'); f.reset(); await w(60); ok(!bar.classList.contains('is-on'), 'descartar não limpou'); });
  await t('dinheiro: centavos entram pela direita e Backspace apaga', async () => { mount('money'); const m = $('[data-ac="money"]', palco), i = $('.ac-money__field', m); const type = (k, d) => i.dispatchEvent(new InputEvent('beforeinput', { inputType: k, data: d, cancelable: true, bubbles: true })); type('insertText', '1'); type('insertText', '2'); type('insertText', '5'); ok(i.value === 'R$ 1,25', 'valor ' + i.value); type('deleteContentBackward'); ok(i.value === 'R$ 0,12', 'apagar ' + i.value); });
  await t('dinheiro: mínimo, máximo, taxa e envio travado', async () => { mount('money'); const m = $('[data-ac="money"]', palco), i = $('.ac-money__field', m), h = $('.ac-money__hint', m), b = $('[type=submit]', palco); m._money.set(5); ok(/mínimo/.test(h.textContent) && b.disabled, 'mínimo'); m._money.set(2000); ok(/acima/.test(h.textContent) && i.getAttribute('aria-invalid') === 'true', 'máximo'); m._money.set(100); ok(/R\$\s?103,67/.test(h.textContent) && !b.disabled, 'taxa: ' + h.textContent); $('.ac-money__max', m).click(); ok(m._money.get() === 1250.4, 'máximo ' + m._money.get()); ok($('input[type=hidden]', m).value === '1250.40', 'oculto'); });
  await t('telefone: máscara do Brasil e campos ocultos', async () => { mount('phone'); const p = $('[data-ac="phone"]', palco), i = $('.ac-phone__input', p); i.value = '11912345678'; i.dispatchEvent(new Event('input')); ok(i.value === '(11) 91234-5678', 'máscara ' + i.value); const h = $$('input[type=hidden]', p).map(x => x.value).join('|'); ok(h === '11912345678|55|br', 'ocultos ' + h); ok(i.getAttribute('aria-invalid') === 'false', 'inválido'); });
  await t('telefone: trocar país pela busca muda DDI e máscara', async () => { mount('phone'); const p = $('[data-ac="phone"]', palco); $('.ac-phone__country', p).click(); await w(20); const q = $('body > .ac-pop input'); q.value = 'portugal'; q.dispatchEvent(new Event('input')); key(q, 'Enter'); await w(20); ok($('.ac-phone__ddi', p).textContent === '+351', 'ddi ' + $('.ac-phone__ddi', p).textContent); const i = $('.ac-phone__input', p); i.value = '912345678'; i.dispatchEvent(new Event('input')); ok(i.value === '912 345 678', 'máscara ' + i.value); });
  await t('abas que transbordam: setas e aba visível', async () => { mount('tabs-many'); palco.style.width = '360px'; await w(80); const l = $('.ac-tabs__list', palco); ok(l.hasAttribute('data-overflow-end'), 'sem transbordo'); const tabs = $$('.ac-tabs__tab', palco); tabs[0].focus(); key(tabs[0], 'End'); await w(400); const r = tabs[8].getBoundingClientRect(), lr = l.getBoundingClientRect(); ok(r.right <= lr.right + 1, 'última aba fora da vista'); ok(l.hasAttribute('data-overflow-start'), 'sem seta do começo'); palco.style.width = '900px'; });
  await t('tour: pula alvo inexistente, setas andam e Esc fecha', async () => { mount('tour'); $('#tour-start', palco).click(); await w(30); const tip = $('.ac-tour__tip'); ok(tip && /1 de 4/.test(tip.textContent), 'contagem: ' + (tip && tip.textContent.slice(0, 20))); key(document, 'ArrowRight'); await w(30); ok(/Suas vendas/.test($('.ac-tour__tip').textContent), 'passo 2'); key(document, 'ArrowRight'); key(document, 'ArrowRight'); await w(30); ok(/Crie um produto/.test($('.ac-tour__tip').textContent), 'não pulou o inexistente'); key(document, 'Escape'); await w(30); ok(!$('.ac-tour__tip') && !$('.ac-tour__spot'), 'não fechou'); });
  await t('sidebar: teclado muda a largura e recolhe abaixo de 180', async () => { try { localStorage.removeItem('orthos.sidebar.w'); } catch (_) {} mount('sidebar'); const s = $('.ac-sidebar', palco), h = $('[data-ac-resize]', s); ok(h.getAttribute('role') === 'separator', 'papel'); key(h, 'ArrowRight', { shiftKey: true }); await w(400); ok(h.getAttribute('aria-valuenow') === '272', 'largura ' + h.getAttribute('aria-valuenow')); key(h, 'Home'); for (let k = 0; k < 4; k++) key(h, 'ArrowLeft', { shiftKey: true }); ok(s.dataset.collapsed === 'true', 'não recolheu'); key(h, 'ArrowRight'); ok(s.dataset.collapsed === 'false', 'não reabriu'); try { localStorage.removeItem('orthos.sidebar.w'); } catch (_) {} });
  await t('rolagem: lista acompanha o teclado sem rolar a página (sem scrollIntoView)', async () => { mount('combobox'); const i = $('input', palco); i.focus(); i.dispatchEvent(new Event('input')); await w(20); const y0 = scrollY; key(i, 'ArrowUp'); await w(260); const lb = $('body > .ac-pop .ac-listbox'), act = $('[aria-selected="true"]', lb); ok(lb.scrollTop > 0, 'lista não rolou'); const a = act.getBoundingClientRect(), b = lb.getBoundingClientRect(); ok(a.top >= b.top - 1 && a.bottom <= b.bottom + 1, 'opção ativa fora da vista'); ok(scrollY === y0, 'a página rolou'); ok(!/scrollIntoView\(/.test(String(Orthos.components.combo)), 'ainda usa scrollIntoView'); key(document, 'Escape'); });
  await t('tokens novos definidos', () => { const s = getComputedStyle(document.documentElement); ['--ac-dur-fast', '--ac-dur-base', '--ac-ease-standard', '--ac-btn-radius'].forEach(v => ok(s.getPropertyValue(v).trim(), v)); });
  /* levantamento de 28/10/2026: carrossel, tabela em cartões, senha, conversa, copiável, faixas, cartões, sheet, confirm, OTP */
  const until = async (fn, ms = 1600) => { const t0 = Date.now(); while (Date.now() - t0 < ms) { if (fn()) return true; await w(30); } return fn(); };
  const within = (p, ms = 2500) => Promise.race([p, w(ms).then(() => { throw new Error('tempo esgotado'); })]);
  // página de 390 px num iframe (fixo e invisível, para o navegador não pausar o rAF de um quadro fora da tela)
  const frame = (body, wd = 390, ht = 720) => new Promise(r => { const f = document.createElement('iframe'); f.style.cssText = `position:fixed;left:0;top:0;width:${wd}px;height:${ht}px;border:0;opacity:0;pointer-events:none;z-index:-1`; f.srcdoc = `<!doctype html><html lang="pt-BR"><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../src/orthos.css"></head><body class="ac" style="margin:0">${body}<script src="../src/orthos.js"><\/script></body></html>`; f.onload = () => r(f); document.body.appendChild(f); });
  await t('carrossel: papéis, bolinhas, inert e setas nos controles', async () => {
    mount('carousel'); const c = $('[data-ac="carousel"]', palco), sl = $$('.ac-carousel__slide', c), dots = $$('.ac-carousel__dot', c);
    ok(c.getAttribute('role') === 'region' && c.getAttribute('aria-roledescription') === 'carrossel' && c.getAttribute('aria-label'), 'região');
    ok(sl[1].getAttribute('role') === 'group' && sl[1].getAttribute('aria-roledescription') === 'slide' && sl[1].getAttribute('aria-label') === '2 de 4', 'slide');
    ok(dots[0].getAttribute('aria-current') === 'true' && dots[0].tabIndex === 0 && dots[1].tabIndex === -1 && !sl[0].inert && sl[1].inert, 'estado inicial');
    dots[0].focus(); key(dots[0], 'ArrowRight'); await until(() => dots[1].getAttribute('aria-current') === 'true');
    ok(dots[1].getAttribute('aria-current') === 'true' && document.activeElement === dots[1], '→ não andou'); ok(sl[0].inert && !sl[1].inert, 'inert');
    key(dots[1], 'End'); await until(() => dots[3].getAttribute('aria-current') === 'true'); ok(dots[3].getAttribute('aria-current') === 'true', 'End');
    const pl = $$('[data-ac="carousel"]', palco)[1], ps = $$('.ac-carousel__slide', pl); ok(!ps[1].inert && ps[2].inert, 'cartão espiando deveria ficar inerte');
  });
  await t('carrossel: Pausar troca o rótulo; sem autoplay não há pausa', () => { mount('carousel'); const [a, b] = $$('[data-ac="carousel"]', palco), p = $('[data-car="pause"]', a); ok(p && p.getAttribute('aria-label') === 'Pausar a troca automática', 'sem botão'); p.click(); ok(p.dataset.paused === 'true' && /Retomar/.test(p.getAttribute('aria-label')), 'não pausou'); ok($('.ac-carousel__track', a).getAttribute('aria-live') === 'polite', 'aria-live'); ok(!$('[data-car="pause"]', b), 'pausa sem autoplay'); });
  await t('tabela: Data table põe data-label, modo cartão e papéis', () => { mount('table'); const tb = $('table', palco), tds = $$('tbody tr:first-child td', tb); ok(tb.classList.contains('ac-table--stack'), 'classe'); ok(tds[0].classList.contains('ac-table__select') && !tds[1].dataset.label && tds[2].dataset.label === 'Função', 'rótulos'); ok(tb.getAttribute('role') === 'table' && tds[2].getAttribute('role') === 'cell', 'papéis'); });
  await t('tabela no celular (390 px): cartões, título, ações no fim e sem rolagem lateral', async () => {
    const f = await frame(DEMOS.find(x => x.id === 'table-stack').html), doc = f.contentDocument, cs = x => f.contentWindow.getComputedStyle(x), tds = [...doc.querySelector('tbody tr').children];
    try {
      ok(cs(doc.querySelector('thead')).position === 'absolute' && doc.querySelector('table').getAttribute('role') === 'table', 'cabeçalho');
      ok(cs(tds[1]).display === 'grid' && cs(tds[0]).display === 'block', 'célula ' + cs(tds[1]).display);
      const last = Math.max(...tds.map(x => x.getBoundingClientRect().bottom)); ok(Math.abs(tds[6].getBoundingClientRect().bottom - last) < 1 && cs(tds[6]).justifyContent === 'flex-end', 'ações');
      ok(doc.documentElement.scrollWidth <= 390, 'rolagem lateral ' + doc.documentElement.scrollWidth);
    } finally { f.remove(); }
  });
  await t('senha: Mostrar/Esconder, regras e envio barrado', async () => {
    mount('password'); const f = $('#pw-form', palco), i = $('#pw-nova', palco), c = $('#pw-conf', palco), b = $('.ac-password__toggle', palco), ul = $('.ac-password__rules', palco);
    const type = (el, v) => { el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); };
    ok(ul.hidden && (i.getAttribute('aria-describedby') || '').includes(ul.id), 'regras com campo vazio');
    b.click(); ok(i.type === 'text' && b.getAttribute('aria-pressed') === 'true', 'não mostrou'); b.click(); ok(i.type === 'password' && b.getAttribute('aria-pressed') === 'false', 'não escondeu');
    type(i, 'abc'); ok(!ul.hidden && i.validity.customError && $$('li[data-ok="true"]', ul).length === 1, 'fraca');
